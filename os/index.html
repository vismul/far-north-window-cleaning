<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FNWC Mobile</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FNWC">
<link rel="apple-touch-icon" href="../logo.png">
<link rel="icon" href="../logo.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ---------------------------------------------------------------------------
   Far North Window Cleaning - the phone app.

   Same data as the desktop tools, laid out for one thumb in the back of the
   ute. Everything is sized for a phone first; the desktop layout is the one
   special case, not the other way round.
   ------------------------------------------------------------------------- */
:root{
  --bg:#0b1220; --panel:#111c2f; --panel2:#16243c; --line:#22334f;
  --ink:#e8eefb; --dim:#93a4c2; --faint:#64789c;
  --brand:#38bdf8; --brand2:#0ea5e9;
  --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --r:14px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
a{color:var(--brand)}

/* ---- shell ---- */
#app{min-height:100%;display:flex;flex-direction:column}

header#top{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--sat) + 8px) 12px 8px;
  background:rgba(11,18,32,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
#burger{
  width:42px;height:42px;flex:none;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);display:grid;place-items:center;cursor:pointer
}
#burger span{display:block;width:17px;height:2px;background:var(--ink);border-radius:2px;box-shadow:0 -5px 0 var(--ink),0 5px 0 var(--ink)}
#title{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#searchBtn{
  flex:none;width:40px;height:40px;border:1px solid var(--line);background:var(--panel);
  border-radius:11px;font-size:15px;cursor:pointer;line-height:1
}
body.searching #searchBtn{background:var(--brand2)}
#syncBtn{
  flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:8px 11px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer
}
#syncBtn .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
#syncBtn.ok .dot{background:var(--good)}
#syncBtn.busy .dot{background:var(--brand);animation:pulse 1s infinite}
#syncBtn.err .dot{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
#syncBtn .lbl{display:none}
@media(min-width:400px){#syncBtn .lbl{display:inline}}

main{flex:1;padding:12px 12px calc(var(--sab) + 28px);max-width:760px;width:100%;margin:0 auto}

/* ---- sidebar ---- */
#scrim{position:fixed;inset:0;background:rgba(2,6,16,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
body.nav #scrim{opacity:1;pointer-events:auto}
nav#side{
  position:fixed;top:0;left:0;bottom:0;width:265px;max-width:84vw;z-index:60;
  background:var(--panel);border-right:1px solid var(--line);
  transform:translateX(-100%);transition:transform .22s cubic-bezier(.3,.7,.3,1);
  display:flex;flex-direction:column;
  padding-top:var(--sat);padding-bottom:var(--sab);
}
body.nav nav#side{transform:none}
#side .brand{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#side .brand b{display:block;font-size:16px}
#side .brand small{color:var(--faint);font-size:12px}
#side .list{flex:1;overflow-y:auto;padding:8px}
#side a.nav{
  display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:11px;
  color:var(--ink);text-decoration:none;font-weight:600;font-size:15px
}
#side a.nav .ico{width:22px;text-align:center;font-size:17px;flex:none;opacity:.9}
#side a.nav .cnt{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:1px 8px;font-size:11px;color:var(--dim);font-weight:700}
#side a.nav.on{background:var(--brand2);color:#04121f}
#side a.nav.on .cnt{background:rgba(0,0,0,.2);border-color:transparent;color:#04121f}
#side .sep{height:1px;background:var(--line);margin:8px 10px}
#side .ghead{
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:14px 12px 5px
}
#side .ghead:first-child{padding-top:6px}
#side .foot{padding:10px 16px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

@media(min-width:900px){
  body{display:block}
  nav#side{transform:none;box-shadow:none}
  #app{margin-left:265px}
  #burger,#scrim{display:none}
  main{padding-left:20px;padding-right:20px}
}

/* ---- building blocks ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:2px}
.sub{color:var(--dim);font-size:13px}
.tiny{color:var(--faint);font-size:12px}
.rowx{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.mt{margin-top:12px}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.4px}
.stat span{color:var(--dim);font-size:12px}

.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  border-radius:11px;padding:12px 14px;font-weight:600;font-size:15px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px
}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.p{color:#04121f}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--brand2);border-color:var(--brand2);color:#04121f}
.btn.g{background:var(--good);border-color:var(--good);color:#05210f}
.btn.d{color:#fca5a5}
.btn.sm{padding:8px 11px;font-size:13px;min-height:38px;border-radius:9px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;font-weight:600}
.in{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:12px;font-size:16px;   /* 16px stops iOS zooming on focus */
}
.in:focus{outline:none;border-color:var(--brand)}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;margin-bottom:9px;cursor:pointer
}
.item .t{font-weight:700;font-size:15px}
.item .m{color:var(--dim);font-size:13px;margin-top:2px}
.item .r{margin-left:auto;text-align:right;flex:none}

.tag{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap
}
.tag.good{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);color:#86efac}
.tag.warn{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.4);color:#fcd34d}
.tag.bad{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4);color:#fca5a5}
.tag.info{background:rgba(56,189,248,.14);border-color:rgba(56,189,248,.4);color:#7dd3fc}

.empty{text-align:center;padding:34px 16px;color:var(--faint)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.5}

.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--dim);padding:9px 12px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--brand2);color:#04121f}

.chip{border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand2);border-color:var(--brand2);color:#04121f}

/* ---- sheet (the slide-up editor) ---- */
#sheet{position:fixed;inset:0;z-index:70;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(2,6,16,.68)}
#sheet .pane{
  position:absolute;left:0;right:0;bottom:0;max-height:92%;
  background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  display:flex;flex-direction:column;animation:up .24s cubic-bezier(.3,.8,.3,1)
}
@keyframes up{from{transform:translateY(100%)}}
#sheet .head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#sheet .head h3{flex:1;font-size:16px}
#sheet .body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet .foot{padding:12px 16px calc(12px + var(--sab));border-top:1px solid var(--line);display:flex;gap:9px}
#sheet .foot .btn{flex:1}
@media(min-width:900px){
  #sheet .pane{left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);width:520px;border-radius:18px;border:1px solid var(--line);animation:none}
}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 20px);z-index:90;
  background:#e8eefb;color:#0b1220;padding:11px 17px;border-radius:999px;font-weight:700;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px)
}
#toast.show{opacity:1}
#toast.act{pointer-events:auto}
#toast button{
  border:0;background:#0b1220;color:#e8eefb;border-radius:999px;padding:7px 14px;
  font-weight:700;font-size:13px;cursor:pointer;flex:none
}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.shot{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{
  position:absolute;top:4px;right:4px;width:26px;height:26px;border:0;border-radius:50%;
  background:rgba(2,6,16,.72);color:#fff;font-size:16px;line-height:1;cursor:pointer
}
.shot .lbl{
  position:absolute;left:4px;bottom:4px;background:rgba(2,6,16,.72);color:#e8eefb;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:uppercase
}

/* ---- search ---- */
#searchWrap{padding:0 12px 10px;max-width:760px;margin:0 auto;display:none}
body.searching #searchWrap{display:block}
#searchIn{width:100%}
.sres{margin-top:8px}
.sres .kind{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 4px;font-weight:700}

.money{font-variant-numeric:tabular-nums}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.q-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.q-line:last-child{border-bottom:0}
.q-total{font-size:34px;font-weight:800;letter-spacing:-1px;margin:6px 0 0}

.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg)}
.stepper button{width:48px;min-height:48px;border:0;background:var(--panel2);color:var(--ink);font-size:22px;font-weight:600;cursor:pointer}
.stepper input{flex:1;width:100%;min-width:0;border:0;background:transparent;text-align:center;font-size:17px;font-weight:700;padding:12px 0}
.stepper input:focus{outline:none}
</style>
</head>
<body>

<div id="scrim"></div>

<nav id="side">
  <div class="brand">
    <b>Far North Window Cleaning</b>
    <small>Cairns &middot; on the phone</small>
  </div>
  <div class="list" id="navList"></div>
  <div class="foot" id="navFoot"></div>
</nav>

<div id="app">
  <header id="top">
    <button id="burger" aria-label="Menu"><span></span></button>
    <div id="title">Today</div>
    <button id="searchBtn" aria-label="Search">🔍</button>
    <button id="syncBtn"><span class="dot"></span><span class="lbl">Sync</span></button>
  </header>
  <div id="searchWrap">
    <input class="in" id="searchIn" type="search" placeholder="Search a name, suburb, invoice or note">
    <div class="sres" id="searchRes"></div>
  </div>
  <main id="view"></main>
</div>

<div id="sheet"><div class="bg"></div><div class="pane">
  <div class="head"><h3 id="sheetTitle"></h3><button class="btn sm" id="sheetX">Close</button></div>
  <div class="body" id="sheetBody"></div>
  <div class="foot" id="sheetFoot"></div>
</div></div>

<div id="toast"></div>

<script src="fnwc-firebase-config.js"></script>
<script>
window.FNWC_SYNC_NO_PILL = true;   /* this app draws its own sync button */

/* Bumped whenever this file changes, so Settings can tell you which build you
   are actually looking at. Worth having: "is it even the new version?" is
   otherwise impossible to answer from a phone. */
window.FNWC_BUILD = "2026-09-14a";

/* An app on the home screen will otherwise sit on a copy of this page from
   days ago. The worker fetches fresh every time and keeps a copy only for
   when there is no signal. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.addEventListener("updatefound", function () {
        var sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", function () {
          /* A new version has landed and an old one was already running -
             take it now rather than on some unpredictable later launch. */
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            sw.postMessage("skipWaiting");
            location.reload();
          }
        });
      });
      /* Also ask on every launch, not just when the browser feels like it. */
      reg.update();
    })["catch"](function () { /* no worker is survivable; the app still runs */ });
  });
}
</script>
<script src="fnwc-sync.js"></script>
<script src="fnwc-followups.js"></script>
<script src="fnwc-money.js"></script>
<script src="fnwc-geo.js"></script>
<script src="fnwc-calibrate.js"></script>
<script src="fnwc-enquiry.js"></script>
<script src="fnwc-vehicle.js"></script>
<script src="fnwc-import.js"></script>
<script>
(function () {
  "use strict";

  /* =========================================================================
     STORE
     Byte for byte the same shape the desktop tools use, so a record made here
     opens there and the other way round. fnwc-sync.js keeps the two copies
     level; this file never talks to Firestore itself.
     ====================================================================== */

  var KEY = "fnwc-os-v1";
  var QKEY = "fnwc-quoter-v2";

  var OS_DEFAULTS = {
    targetRate: 90, hoursPerDay: 7, daysPerWeek: 5,
    fuelPerKm: 0.28, consumablesPct: 3, feePct: 0,
    travelDefault: 30, quoteChase: 2, quoteDead: 21,
    dueSoon: 21, atRisk: 1.6, reviewAfter: 2
  };

  /* Liam's rate card - identical to quote-calculator.html. */
  var Q_DEFAULTS = {
    minSingle: 150, minDouble: 250,
    stdOut: 9, stdBoth: 13, lrgOut: 12, lrgBoth: 18, upOut: 12, upBoth: 16,
    flyscreen: 4, securityScreen: 5, track: 4, slidingDoor: 20,
    hardPct: 25, heavyPct: 37.5, travelFee: 70,
    discQ: 12, discH: 6, targetRate: 90, gst: false
  };
  var TIME = {
    setup: 20, stdOut: 3.5, stdBoth: 7.5, lrgOut: 5, lrgBoth: 10,
    upOut: 5, upBoth: 9, flyscreen: 3, securityScreen: 4, track: 2.5,
    slidingDoor: 6, hardMult: 1.3, heavyMult: 1.5, travelLocal: 15, travelFar: 50
  };

  var CATS = ["Fuel", "Vehicle & rego", "Equipment & tools", "Consumables",
              "Insurance", "Phone & internet", "Advertising", "Safety gear",
              "Accounting & fees", "Training", "Other"];

  var db = { v: 1, demo: false, settings: {}, leads: [], jobs: [], customers: [], expenses: [] };
  var qset = {};

  var canStore = (function () {
    try { localStorage.setItem("__p", "1"); var o = localStorage.getItem("__p") === "1"; localStorage.removeItem("__p"); return o; }
    catch (e) { return false; }
  })();

  function load() {
    db = { v: 1, demo: false, settings: {}, leads: [], jobs: [], customers: [], expenses: [] };
    if (canStore) {
      try {
        var d = JSON.parse(localStorage.getItem(KEY) || "null");
        if (d) {
          /* Carry across anything this app does not itself use, exactly as the
             desktop tools do - otherwise a save here would drop it. */
          Object.keys(d).forEach(function (k) { db[k] = d[k]; });
          db.leads = d.leads || []; db.jobs = d.jobs || [];
          db.customers = d.customers || []; db.expenses = d.expenses || [];
        }
      } catch (e) {}
      try { qset = JSON.parse(localStorage.getItem(QKEY) || "null") || {}; } catch (e) { qset = {}; }
    }
    db.settings = Object.assign({}, OS_DEFAULTS, db.settings || {});
    qset = Object.assign({}, Q_DEFAULTS, qset);
  }

  /* Every write re-reads first. Sync can have replaced the store between the
     moment a form opened and the moment Save was tapped, and a blind write
     would throw away whatever came in from the PC in between. */
  function commit(fn) {
    if (!canStore) {
      toast("This browser is blocking storage");
      alert("Your browser is blocking storage, so nothing you enter can be kept.\n\n" +
            "On iPhone this usually means Private Browsing. Open this page in a normal tab.");
      return false;
    }
    load();
    fn(db);
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
      return true;
    } catch (e) {
      alert("That could NOT be saved - storage is full.\n\n" +
            "Open the Books on the PC and clear out some old receipt photos.");
      return false;
    }
  }

  function saveQ() {
    if (!canStore) return;
    try { localStorage.setItem(QKEY, JSON.stringify(qset)); } catch (e) {}
  }

  /* ---- bits and pieces ---- */

  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function money(n) { return "$" + (Math.round((+n || 0) * 100) / 100).toLocaleString("en-AU", { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
  function money2(n) { return "$" + (+n || 0).toFixed(2); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function daysAgo(iso) { return iso ? daysBetween(iso, todayISO()) : null; }
  function addDays(iso, n) { var d = new Date(iso); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  /* Months, not 30-day blocks - three months on from the 31st of August is the
     30th of November, not the 1st of December. */
  function addMonthsISO(iso, n) {
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    var day = d.getDate();
    var out = new Date(d.getFullYear(), d.getMonth() + n, 1);
    var last = new Date(out.getFullYear(), out.getMonth() + 1, 0).getDate();
    out.setDate(Math.min(day, last));
    return out.getFullYear() + "-" + pad(out.getMonth() + 1) + "-" + pad(out.getDate());
  }
  function niceDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    var t = todayISO();
    if (iso === t) return "Today";
    if (iso === addDays(t, 1)) return "Tomorrow";
    if (iso === addDays(t, -1)) return "Yesterday";
    /* The year only appears when it is not this one. Without it a job from
       last November reads as this coming November, which is the difference
       between a customer who is due and one who left a year ago. */
    var o = { weekday: "short", day: "numeric", month: "short" };
    if (d.getFullYear() !== new Date().getFullYear()) {
      o.year = "numeric";
      delete o.weekday;                  /* the weekday stops earning its space */
    }
    return d.toLocaleDateString("en-AU", o);
  }
  /* niceDate says "Today" and "Yesterday", which is right nearly everywhere
     and wrong at either end of a date range - "Today to Sun 6 Dec" reads like
     a mistake. This is the plain form for ranges. */
  function plainDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    var o = { day: "numeric", month: "short" };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
    return d.toLocaleDateString("en-AU", o);
  }

  function custName(id) {
    var c = db.customers.filter(function (x) { return x.id === id; })[0];
    return c ? c.name : "(unknown)";
  }
  function custOf(id) { return db.customers.filter(function (x) { return x.id === id; })[0] || null; }
  function tel(p) { return String(p || "").replace(/[^0-9+]/g, ""); }

  var $ = function (s, r) { return (r || document).querySelector(s); };

  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.className = "show";
    clearTimeout(t._h); t._h = setTimeout(function () { t.className = ""; }, 2000);
  }

  /* ---------- undo -------------------------------------------------------
     A dialog asking "are you sure?" stops you every single time to guard
     against the rare slip, and people learn to tap through it without
     reading - which is the worst of both. Doing the thing and offering it
     back for a few seconds is faster to use and safer in practice.

     The snapshot is the whole store, which is only tens of kilobytes and
     removes any chance of a partial undo putting things in a state that never
     existed. Sync is told to hold off while the offer stands, so an undone
     change is never pushed to the other device and pulled back.
     --------------------------------------------------------------------- */

  var undoTimer = null, undoSnapshot = null;

  function doWithUndo(label, change, opts) {
    opts = opts || {};
    var before = localStorage.getItem(KEY);
    if (!commit(change)) return false;

    undoSnapshot = before;
    var t = $("#toast");
    t.textContent = "";
    t.appendChild(document.createTextNode(label));

    var b = document.createElement("button");
    b.type = "button";
    b.textContent = "Undo";
    b.onclick = function () {
      clearTimeout(undoTimer);
      t.className = "";
      if (undoSnapshot != null) {
        try { localStorage.setItem(KEY, undoSnapshot); } catch (e) {}
        undoSnapshot = null;
      }
      toast("Put back");
      if (opts.after) opts.after();
      render();
    };
    t.appendChild(b);

    t.className = "show act";
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function () {
      t.className = "";
      undoSnapshot = null;
      /* Only now is it really gone, so anything that cannot be undone - a
         server-side delete - waits until here. */
      if (opts.commit) opts.commit();
    }, 6000);

    return true;
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("Copied"); },
        function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("style", "position:fixed;top:0;left:0;opacity:0");
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 999999);
    try { document.execCommand("copy"); toast("Copied"); } catch (e) { toast("Could not copy"); }
    ta.remove();
  }

  /* =========================================================================

      el.className = "btn " + (b.cls || "");

      el.onclick = b.on;

    document.body.style.overflow = "hidden";

  function closeSheet() {
    sheet.classList.remove("open");

  $("#sheetX").onclick = closeSheet;

  function field(label, id, type, opts, value, extra) {
    var v = value == null ? "" : value;
    var h = '<label class="f"><span>' + esc(label) + "</span>";
    if (type === "select") {
      h += '<select class="in" id="' + id + '">';
      opts.forEach(function (o) {
        var val = o[0], lab = o[1];
        h += '<option value="' + esc(val) + '"' + (String(v) === String(val) ? " selected" : "") + ">" + esc(lab) + "</option>";
      });
      h += "</select>";
    } else if (type === "textarea") {
      h += '<textarea class="in" id="' + id + '"' + (extra || "") + ">" + esc(v) + "</textarea>";
    } else {
      h += '<input class="in" id="' + id + '" type="' + type + '" value="' + esc(v) + '"' + (extra || "") + ">";
    }
    return h + "</label>";
  }
  function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }
  function num(id) { return parseFloat(val(id)) || 0; }
  function int(id) { return parseInt(val(id), 10) || 0; }

    { id: "books",     ico: "\u{1F4D2}", label: "Books, car & tax" },

  function go(id) {

    render();

  function render() {
    load();
    drawNav();
    var n = NAV.filter(function (x) { return x.id === view; })[0];
    $("#title").textContent = n ? n.label : "FNWC";
    $("#view").innerHTML = "";
    ({
      today: vToday, diary: vDiary, jobs: vJobs, leads: vLeads,

  function html(parent, s) { parent.insertAdjacentHTML("beforeend", s); }
  function on(sel, fn, root) {
    (root || document).querySelectorAll(sel).forEach(function (e) { e.onclick = function (ev) { fn(e, ev); }; });
  }
  function empty(icon, title, note) {
    return '<div class="empty"><div class="big">' + icon + "</div><b>" + esc(title) + "</b>" +
           (note ? '<div class="tiny mt">' + esc(note) + "</div>" : "") + "</div>";

  /* ---------------------------------------------------------------- TODAY */

  function weekStart() {
    var d = new Date(); var day = (d.getDay() + 6) % 7;   /* Monday = 0 */
    d.setDate(d.getDate() - day);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function vToday(root) {
    var t = todayISO(), ws = weekStart();
    var todays = db.jobs.filter(function (j) { return j.date === t; })
                        .sort(function (a, b) { return (a.suburb || "").localeCompare(b.suburb || ""); });
    var weekDone = db.jobs.filter(function (j) {
      return j.date >= ws && j.date <= t && j.status !== "scheduled" && j.status !== "cancelled";
    });
    var weekMoney = weekDone.reduce(function (s, j) { return s + (+j.price || 0); }, 0);
    /* Everything earned but not banked - invoices out, plus work finished
       that has not been billed yet. The two are different problems, but they
       are the same money as far as the week is concerned. */
    var mon = FNWCMoney.summary(db, t);
    var owed = mon.atStake;
    var hot = db.leads.filter(function (l) {
      if (l.stage === "won" || l.stage === "lost") return false;
      var d = daysAgo(l.lastContact || l.received);
      return d != null && d >= (db.settings.quoteChase || 2);
    });

    html(root,
      '<div class="grid3" style="margin-bottom:12px">' +
        '<div class="stat"><b>' + todays.filter(function (j) { return j.status === "scheduled"; }).length + "</b><span>on today</span></div>" +
        '<div class="stat"><b class="money">' + money(weekMoney) + "</b><span>this week</span></div>" +
        '<div class="stat"><b class="money">' + money(owed) + "</b><span>owed to you</span></div>" +
      "</div>");

    html(root, '<div class="wrap" style="margin-bottom:14px">' +
      '<button class="btn p" data-a="job">+ Job</button>' +
      '<button class="btn" data-a="lead">+ Lead</button>' +
      '<button class="btn" data-a="exp">+ Expense</button>' +
      '<a class="btn" href="#quote">Quote it</a>' +
      "</div>");

    /* Money you have earned and not received is the most urgent thing on this
       screen, so it says so before anything else. */
    if (mon.overdue || mon.unbilled) {
      var bits = [];
      if (mon.overdue) bits.push(money(mon.overdueValue) + " overdue" +
        (mon.oldest != null ? ", oldest " + mon.oldest + " days" : ""));
      if (mon.unbilled) bits.push(mon.unbilled + " job" + (mon.unbilled === 1 ? "" : "s") +
        " finished but not invoiced (" + money(mon.unbilledValue) + ")");
      html(root, '<a class="card" href="#money" style="display:block;text-decoration:none;color:inherit;' +
        'border-color:' + (mon.overdue ? "var(--bad)" : "var(--warn)") + '">' +
        '<div class="spread"><h3>\u{1F4B0} Money waiting on you</h3><span class="tag ' +
        (mon.overdue ? "bad" : "warn") + '">open</span></div>' +
        '<div class="sub" style="margin-top:4px">' + esc(bits.join(". ")) + ".</div></a>");
    }

    /* The follow-ups are the thing that quietly makes the money, so they get
       said out loud here rather than waiting to be found in the menu. */
    var fu = FNWCFollowUps.summary(db, t);
    if (fu.total) {
      html(root, '<a class="card" href="#followups" style="display:block;text-decoration:none;color:inherit;' +
        'border-color:var(--brand2)"><div class="spread"><h3>\u{1F514} ' + fu.total +
        " follow up" + (fu.total === 1 ? "" : "s") + " waiting</h3>" +
        '<span class="tag info">open</span></div>' +
        '<div class="sub" style="margin-top:4px">' +
        (fu.rebooks ? fu.rebooks + " to chase for another clean, about " + money(fu.expected) + " of work" : "") +
        (fu.rebooks && fu.reviews ? ". " : "") +
        (fu.reviews ? fu.reviews + " happy customer" + (fu.reviews === 1 ? "" : "s") + " to ask for a review" : "") +
        ".</div></a>");
    }

    html(root, "<h3 style=\"margin-bottom:8px\">" + niceDate(t) + "</h3>");
    if (!todays.length) {
      html(root, '<div class="card">' + empty("\u{1F334}", "Nothing booked today",
        "Tap + Job to put something in, or open the Diary to see what is coming up.") + "</div>");
    } else {
      todays.forEach(function (j) { html(root, jobCard(j)); });
    }

    if (hot.length) {
      html(root, '<h3 style="margin:18px 0 8px">Needs a chase <span class="tag warn">' + hot.length + "</span></h3>");
      hot.slice(0, 5).forEach(function (l) { html(root, leadCard(l)); });
    }

    on("[data-a]", function (e) {
      ({ job: editJob, lead: editLead, exp: editExpense })[e.dataset.a]();
    }, root);
    wireJobCards(root);
    wireLeadCards(root);
  }

  /* ---------------------------------------------------------------- DIARY */

  function vDiary(root) {
    var t = todayISO();
    var days = {};
    db.jobs.forEach(function (j) {
      if (j.status === "cancelled") return;
      if (!j.date || j.date < t) return;
      (days[j.date] = days[j.date] || []).push(j);
    });
    var keys = Object.keys(days).sort();

    html(root, '<button class="btn p full" data-a="job" style="margin-bottom:14px">+ Book a job in</button>');

    if (!keys.length) {
      html(root, '<div class="card">' + empty("\u{1F4C5}", "Diary is clear",
        "Nothing booked from today onwards.") + "</div>");
    } else {
      keys.slice(0, 60).forEach(function (d) {
        var list = days[d];
        var take = list.reduce(function (s, j) { return s + (+j.price || 0); }, 0);
        var plan = FNWCGeo.planDay(db, d);
        var hrs = Math.round(plan.totalMinutes / 60 * 10) / 10;

        html(root,
          '<div class="spread" style="margin:16px 0 8px">' +
          "<h3>" + esc(niceDate(d)) + "</h3>" +
          '<span class="tiny">' + list.length + " job" + (list.length > 1 ? "s" : "") +
          " &middot; " + money(take) + " &middot; " + hrs + "h</span></div>");

        /* What the driving actually costs, and whether the day is a silly
           shape. This is the bit nothing used to say out loud. */
        if (plan.stops.length) {
          html(root, '<div class="card" style="padding:10px 12px;margin-bottom:9px' +
            (plan.scattered ? ";border-color:var(--warn)" : "") + '">' +
            '<div class="wrap">' +
              '<span class="tag">' + plan.km + " km</span>" +
              '<span class="tag">' + Math.round(plan.driveMinutes) + " min driving</span>" +
              '<span class="tag">' + money2(plan.fuelCost) + " fuel</span>" +
              plan.zones.map(function (z) { return '<span class="tag info">' + esc(z) + "</span>"; }).join("") +
            "</div>" +
            (plan.scattered
              ? '<div class="tiny" style="margin-top:7px;color:var(--warn)">That is a lot of ground for one day. ' +
                "Doing these in separate runs would cost you less driving.</div>" : "") +
            (plan.kmSaved > 1
              ? '<button class="btn sm full mt" data-order="' + esc(d) + '">Best order saves ' +
                plan.kmSaved + " km</button>" : "") +
            (plan.unplaced.length
              ? '<div class="tiny" style="margin-top:7px">' + plan.unplaced.length +
                " job" + (plan.unplaced.length === 1 ? "" : "s") + " not on the map yet - " +
                '<a href="#settings">place the suburb</a> to include them.</div>' : "") +
            "</div>");
        }

        list.forEach(function (j) { html(root, jobCard(j)); });
      });
      on("[data-order]", function (e) { routeSheet(e.dataset.order); }, root);
    }
    on("[data-a]", function () { editJob(); }, root);
    wireJobCards(root);

  /* ----------------------------------------------------------------- JOBS */

  var JOB_STATUS = [["scheduled", "Booked in"], ["done", "Done"], ["invoiced", "Invoiced"],
                    ["paid", "Paid"], ["cancelled", "Cancelled"]];
  var STATUS_TAG = { scheduled: "info", done: "warn", invoiced: "warn", paid: "good", cancelled: "" };
  var STATUS_LABEL = { scheduled: "Booked in", done: "Done", invoiced: "Invoiced", paid: "Paid", cancelled: "Cancelled" };

  function jobCard(j) {
    var c = custOf(j.customerId);

    var rate = mins > 0 ? (+j.price || 0) / (mins / 60) : 0;
    return '<div class="item" data-job="' + esc(j.id) + '">' +

  function jobSheet(id) {
    var j = db.jobs.filter(function (x) { return x.id === id; })[0];
    if (!j) return;
    var c = custOf(j.customerId);
    var mins = (+j.estMin || 0) + (+j.travelMin || 0);
    var rate = mins > 0 ? (+j.price || 0) / (mins / 60) : 0;

    var h = '<div class="spread"><h3>' + esc(c ? c.name : "(unknown)") + "</h3>" +
            '<span class="tag ' + (STATUS_TAG[j.status] || "") + '">' + esc(STATUS_LABEL[j.status] || j.status) + "</span></div>" +
            '<div class="sub">' + esc(niceDate(j.date)) + (j.suburb ? " &middot; " + esc(j.suburb) : "") + "</div>";

    if (c && c.phone) {
      h += '<div class="wrap mt">' +
           '<a class="btn sm" href="tel:' + esc(tel(c.phone)) + '">Call ' + esc(c.phone) + "</a>" +
           '<a class="btn sm" href="sms:' + esc(tel(c.phone)) + '">Text</a>' +
           (j.suburb ? '<a class="btn sm" target="_blank" rel="noopener" href="https://maps.google.com/?q=' +

    h += '<hr class="sep">';
    if (j.services) h += '<div class="sub" style="margin-bottom:10px">' + esc(j.services) + "</div>";

         '<div class="q-line"><span>On site</span><b>' + (+j.estMin || 0) + " min</b></div>" +
         '<div class="q-line"><span>Travel</span><b>' + (+j.travelMin || 0) + " min</b></div>" +
         (j.actualMin ? '<div class="q-line"><span>Actually took</span><b>' + j.actualMin + " min</b></div>" : "") +
         '<div class="q-line"><span>Works out at</span><b class="money">' + money(rate) + "/h</b></div>";

    /* Where this one sits in getting paid. Only shown once an invoice exists,
       so it does not clutter a job that has not been done yet. */
    if (FNWCMoney.isInvoiced(j)) {
      var inv = FNWCMoney.invoicedOn(j), due = FNWCMoney.dueOn(db, j);

      if (j.paidAt) h += '<div class="q-line"><span>Paid</span><b>' + esc(niceDate(j.paidAt)) + "</b></div>";
      if (j.reminderCount) h += '<div class="q-line"><span>Chased</span><b>' + j.reminderCount +

    h += '<div class="mt"><span class="tiny">Move it to</span><div class="wrap" style="margin-top:7px">' +

        .map(function (s) { return '<button class="chip" data-s="' + s[0] + '">' + s[1] + "</button>"; }).join("") +
      "</div></div>";

    /* Before and after. Your dispute protection and your marketing in one, and
       the only place a photo of the actual work has ever been able to live. */
    var shots = j.photos || [];
    h += '<hr class="sep"><div class="spread"><span class="tiny">Photos</span>' +
      '<button class="btn sm" data-addshot>Add a photo</button></div>' +
      '<input type="file" id="jp_file" accept="image/*" capture="environment" hidden>' +
      (shots.length
        ? '<div class="shots mt">' + shots.map(function (p, i) {
            return '<div class="shot"><img src="' + esc(p.src) + '" alt="">' +
              '<button class="x" data-delshot="' + i + '">×</button>' +

           setting the word, so the invoice date, number and due date are
           actually recorded. Without them nothing can work out what is late. */
        if (s === "invoiced") { FNWCMoney.markInvoiced(f, id, todayISO()); return; }
        if (s === "paid") {
          FNWCMoney.markInvoiced(f, id, todayISO());   /* cash jobs skip the invoice */
          FNWCMoney.markPaid(f, id, todayISO());
          return;

        f.jobs.forEach(function (x) {

           forever, and every quote after it stays a guess too. */

        render();

  /* Logging the real time has to be quicker than skipping it, or it never
     happens. Chips around the estimate cover most jobs in one tap. */
  function timeSheet(jobId) {
    load();
    var j = db.jobs.filter(function (x) { return x.id === jobId; })[0];
    if (!j) { render(); return; }
    var est = +j.estMin || 90;

    /* Offered around what was quoted, because that is the neighbourhood the
       answer is in - and rounded to something a person would say out loud. */
    var opts = [0.5, 0.75, 1.25, 1.5, 2].map(function (m) {
      return Math.max(15, Math.round(est * m / 15) * 15);
    });
    /* The estimate itself is always offered, unrounded - "it took exactly what
       I said" is a common answer and should be one tap, not typing. */
    opts.push(est);
    opts = opts.filter(function (v, i, a) { return a.indexOf(v) === i; })
               .sort(function (a, b) { return a - b; });

    var h = '<div class="sub">You quoted ' + est + " minutes for " +
      esc(custName(j.customerId)) + ". How long did it actually take?</div>" +
      '<div class="wrap mt">' + opts.map(function (m) {
        return '<button class="chip" data-m="' + m + '">' + fmtMins(m) +
          (m === est ? " (quoted)" : "") + "</button>";
      }).join("") + "</div>" +
      '<div class="mt">' + field("Or type it (minutes)", "tm_min", "number", null, "",
        ' inputmode="numeric" placeholder="' + est + '"') + "</div>" +
      '<div class="tiny">This is what makes the quote calculator get better. ' +
      "Nothing else in here can tell whether your prices work without it.</div>";

    openSheet("How long did that take?", h, [
      { label: "Skip", on: function () { closeSheet(); render(); } },
      { label: "Save", cls: "p", on: function () { saveTime(int("tm_min")); } }
    ]);

    function saveTime(m) {
      if (!(m >= 1)) { toast("How many minutes?"); return; }
      if (commit(function (f) { FNWCCalibrate.logTime(f, jobId, m); })) {
        closeSheet(); toast("Logged " + fmtMins(m)); render();
      }
    }
    on("[data-m]", function (e) { saveTime(parseInt(e.dataset.m, 10)); }, $("#sheetBody"));
  }

  /* A raw phone photo is three or four megabytes. localStorage gives you about
     five in total and every byte also has to go up to Firestore, so nothing
     gets stored until it has been squeezed. */
  function shrinkImage(file, maxPx, quality, done) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) {
          var s = Math.min(maxPx / w, maxPx / h);
          w = Math.round(w * s); h = Math.round(h * s);
        }
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        try { done(cv.toDataURL("image/jpeg", quality)); }
        catch (e) { done(null); }
      };
      img.onerror = function () { done(null); };
      img.src = fr.result;
    };
    fr.onerror = function () { done(null); };
    fr.readAsDataURL(file);
  }

  function fmtMins(m) {
    m = +m || 0;
    if (m < 60) return m + "m";
    var h = Math.floor(m / 60), r = m % 60;
    return h + "h" + (r ? " " + r + "m" : "");
  }

  function editJob(j) {
    var isNew = !j;
    j = j || { id: "", customerId: "", date: todayISO(), suburb: "", services: "",
               price: "", estMin: "", travelMin: db.settings.travelDefault || 30,
               km: "", status: "scheduled", actualMin: "" };

    var custOpts = [["", "-- new customer --"]].concat(
      db.customers.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
        .map(function (c) { return [c.id, c.name]; }));

    var h = field("Customer", "jf_cust", "select", custOpts, j.customerId) +
      '<div id="jf_newWrap">' + field("New customer name", "jf_name", "text", null, isNew ? "" : "") + "</div>" +
      field("Date", "jf_date", "date", null, j.date) +
      field("Suburb", "jf_sub", "text", null, j.suburb) +
      '<div id="jf_near" style="margin:-4px 0 12px"></div>' +
      field("What you are doing", "jf_serv", "text", null, j.services, ' placeholder="Windows in &amp; out, screens"') +
      '<div class="grid2">' +
        field("Price $", "jf_price", "number", null, j.price, ' inputmode="decimal" step="1"') +
        field("On site (min)", "jf_est", "number", null, j.estMin, ' inputmode="numeric"') +
      "</div>" +
      '<div class="grid2">' +
        field("Travel (min)", "jf_trav", "number", null, j.travelMin, ' inputmode="numeric"') +
        field("Km round trip", "jf_km", "number", null, j.km, ' inputmode="decimal"') +
      "</div>" +
      field("Status", "jf_status", "select", JOB_STATUS, j.status) +
      (isNew ? "" : field("Actually took (min)", "jf_act", "number", null, j.actualMin, ' inputmode="numeric"')) +
      /* Booking the whole cycle at once. A booked job is worth far more than a
         reminder to ring someone about booking one. */
      (isNew ? '<label class="f"><span>Book the next ones too</span>' +
        '<select class="in" id="jf_repeat">' +
          '<option value="0">Just this one</option>' +
          '<option value="3">Every 3 months, next 4 visits</option>' +
          '<option value="6">Every 6 months, next 2 visits</option>' +
          '<option value="12">Once a year, next 2 visits</option>' +
        "</select></label>" : "");

    openSheet(isNew ? "New job" : "Edit job", h, [
      { label: "Cancel", on: closeSheet },
      { label: "Save", cls: "p", on: function () {
          var repeated = 0;
          var cid = val("jf_cust");
          var newName = val("jf_name");
          if (!cid && !newName) { toast("Who is it for?"); document.getElementById("jf_name").focus(); return; }

          var ok = commit(function (f) {
            if (!cid) {
              var c = { id: uid(), name: newName, phone: "", email: "", suburb: val("jf_sub"),
                        source: "", freqMonths: 0, notes: "" };
              f.customers.push(c); cid = c.id;
            }
            var rec = {
              customerId: cid,
              date: val("jf_date") || todayISO(),
              suburb: val("jf_sub"),
              services: val("jf_serv"),
              price: num("jf_price"),
              estMin: int("jf_est"),
              travelMin: int("jf_trav"),
              km: num("jf_km"),
              status: val("jf_status") || "scheduled"
            };
            if (!isNew) rec.actualMin = int("jf_act");

            if (isNew) {
              rec.id = uid();
              f.jobs.push(rec);

              /* The whole cycle in one go. Each repeat is the same job moved
                 on by the interval, and the customer's cycle is set to match
                 so the rebook chaser stays consistent with what is booked. */
              var every = parseInt(val("jf_repeat"), 10) || 0;
              if (every > 0) {
                var howMany = every <= 3 ? 3 : 1;      /* plus the one just made */
                for (var n = 1; n <= howMany; n++) {
                  var next = Object.assign({}, rec, {
                    id: uid(),
                    date: addMonthsISO(rec.date, every * n),
                    status: "scheduled"
                  });
                  delete next.actualMin;
                  f.jobs.push(next);
                }
                f.customers.forEach(function (x) {
                  if (x.id === cid && !x.freqMonths) x.freqMonths = every;
                });
                repeated = howMany;
              }
            } else {
              f.jobs.forEach(function (x) { if (x.id === j.id) Object.assign(x, rec); });
            }
          });
          if (ok) {
            closeSheet();
            toast(!isNew ? "Saved"
              : repeated ? "Booked in, plus the next " + repeated
              : "Job booked in");
            render();
          }
        } }
    ]);

    /* The most useful thing this app can say while a job is being booked:
       you are already going near there on Thursday. Nothing saves more
       driving than putting the job on a day the ute is already pointed that
       way, and it is only worth saying at the moment the date is chosen. */
    function suggestDays() {
      var box = document.getElementById("jf_near");
      if (!box) return;
      var sub = val("jf_sub");
      var chosen = val("jf_date") || todayISO();
      box.innerHTML = "";
      if (!sub) return;

      var opts = FNWCGeo.nearbyDays(db, sub, todayISO(), 28).filter(function (o) {
        return o.date !== chosen && (!isNew || o.job.id !== j.id);
      });
      if (!opts.length) return;

      box.innerHTML = '<div class="tiny" style="margin-bottom:6px">You are already near ' +
        esc(titleCase(FNWCGeo.lookup(sub, db).name)) + " on:</div>" +
        '<div class="wrap">' + opts.slice(0, 4).map(function (o) {
          return '<button class="chip" type="button" data-near="' + esc(o.date) + '">' +
            esc(niceDate(o.date)) + " &middot; " + esc(titleCase(o.suburb)) +
            " (" + o.km + " km)</button>";
        }).join("") + "</div>";

      on("[data-near]", function (e2) {
        document.getElementById("jf_date").value = e2.dataset.near;
        toast("Moved to " + niceDate(e2.dataset.near));
        suggestDays();
      }, box);
    }

    /* The "new customer name" box only makes sense when no customer is picked. */
    var sel = document.getElementById("jf_cust"), wrap = document.getElementById("jf_newWrap");
    var sync = function () { wrap.style.display = sel.value ? "none" : "block"; };
    sel.onchange = function () {
      sync();
      var c = custOf(sel.value);
      if (c && c.suburb && !val("jf_sub")) document.getElementById("jf_sub").value = c.suburb;
      suggestDays();
    };
    sync();

    document.getElementById("jf_sub").addEventListener("input", suggestDays);
    document.getElementById("jf_date").addEventListener("change", suggestDays);
    suggestDays();
  }
