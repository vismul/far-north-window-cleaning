    if (!c) return;
    var jobs = db.jobs.filter(function (j) { return j.customerId === id; })
                      .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var spent = jobs.filter(function (j) { return j.status !== "cancelled"; })
                    .reduce(function (s, j) { return s + (+j.price || 0); }, 0);

    var h = "<h3>" + esc(c.name) + "</h3>" +
            '<div class="sub">' + esc(c.suburb || "") + (c.source ? " &middot; " + esc(c.source) : "") + "</div>";
    if (c.phone) {
      h += '<div class="wrap mt">' +
        '<a class="btn sm" href="tel:' + esc(tel(c.phone)) + '">Call ' + esc(c.phone) + "</a>" +
        '<a class="btn sm" href="sms:' + esc(tel(c.phone)) + '">Text</a>' +
        (c.email ? '<a class="btn sm" href="mailto:' + esc(c.email) + '">Email</a>' : "") +
        (c.suburb ? '<a class="btn sm" target="_blank" rel="noopener" href="https://maps.google.com/?q=' +
          encodeURIComponent(c.suburb + " QLD") + '">Map</a>' : "") + "</div>";
    }
    h += '<hr class="sep">' +
      '<div class="q-line"><span>Spent with you</span><b class="money">' + money2(spent) + "</b></div>" +
      '<div class="q-line"><span>Jobs</span><b>' + jobs.length + "</b></div>" +
      (c.freqMonths ? '<div class="q-line"><span>Wants it every</span><b>' + c.freqMonths + " months</b></div>" : "");
    if (c.notes) h += '<div class="sub mt">' + esc(c.notes) + "</div>";

    /* Everything the follow-up screen has decided about this person, in one
       place and reversible. Without this, turning someone off is a one-way
       door you cannot find again. */
    var st = FNWCFollowUps.dueState(db, c, todayISO());
    var bits = [];
    if (c.rebookOff) bits.push(["Rebook chasing is off", "rbon", "Turn back on"]);
    else if (c.rebookSnoozeUntil && c.rebookSnoozeUntil > todayISO())
      bits.push(["Snoozed until " + niceDate(c.rebookSnoozeUntil), "rbon", "Clear snooze"]);
    else if (c.rebookAskedAt) bits.push(["Asked about a rebook " + niceDate(c.rebookAskedAt), null, null]);
    if (st.state && st.state !== "none" && st.dueISO)
      bits.push(["Next clean due " + niceDate(st.dueISO), null, null]);
    if (c.reviewState === "done") bits.push(["Left a review", "rvclear", "Clear"]);
    else if (c.reviewState === "off") bits.push(["Never ask for a review", "rvclear", "Clear"]);
    else if (c.reviewState === "asked") bits.push(["Asked for a review " + niceDate(c.reviewAskedAt), "rvclear", "Clear"]);

    if (bits.length) {
      h += '<hr class="sep"><div class="tiny" style="margin-bottom:6px">Follow ups</div>';
      bits.forEach(function (b) {
        h += '<div class="q-line"><span>' + esc(b[0]) + "</span>" +
             (b[1] ? '<button class="btn sm" data-' + b[1] + '>' + esc(b[2]) + "</button>" : "") + "</div>";
      });
    }

    if (jobs.length) {
      h += '<h4 style="margin:16px 0 8px">History</h4>';
      jobs.slice(0, 12).forEach(function (j) {
        h += '<div class="q-line"><span>' + esc(niceDate(j.date)) + " &middot; " +
             esc(STATUS_LABEL[j.status] || j.status) + '</span><b class="money">' + money(j.price) + "</b></div>";
      });
    }

    openSheet("Customer", h, [
      { label: "Book job", cls: "p", on: function () {
          closeSheet();
          editJob({ id: "", customerId: c.id, date: todayISO(), suburb: c.suburb || "", services: "",
                    price: "", estMin: "", travelMin: db.settings.travelDefault || 30, km: "",
                    status: "scheduled", actualMin: "" });
          /* editJob treats a record with no id as new, which is what we want. */
        } },
      { label: "Edit", on: function () { closeSheet(); editCustomer(c); } },
      { label: "Delete", cls: "d", on: function () { deleteCustomer(c); } }
    ]);

    on("[data-rbon]", function () {
      if (commit(function (f) {
        FNWCFollowUps.stopRebook(f, id, false);
        var t = f.customers.filter(function (x) { return x.id === id; })[0];
        if (t) { delete t.rebookSnoozeUntil; delete t.rebookAskedAt; }
      })) { closeSheet(); toast("Back on the chase list"); render(); }
    }, $("#sheetBody"));

    on("[data-rvclear]", function () {
      if (commit(function (f) {
        var t = f.customers.filter(function (x) { return x.id === id; })[0];
        if (t) { delete t.reviewState; delete t.reviewAskedAt; }
      })) { closeSheet(); toast("Review status cleared"); render(); }
    }, $("#sheetBody"));
  }

  /* Deleting a customer is the one delete in here that can damage something
     else. Jobs point at a customer by id, so removing the customer on its own
     leaves jobs reading "(unknown)" - here and in Window OS - and the money on
     them still counts towards the year. So if there are any, say so and make
     it a deliberate choice which way it goes. */
  function deleteCustomer(c) {
    var jobs = db.jobs.filter(function (j) { return j.customerId === c.id; });
    var worth = jobs.filter(function (j) { return j.status !== "cancelled"; })
                    .reduce(function (s, j) { return s + (+j.price || 0); }, 0);

    function wipe(alsoJobs) {
      closeSheet();
      doWithUndo(alsoJobs && jobs.length
                   ? "Customer and " + jobs.length + " job" + (jobs.length === 1 ? "" : "s") + " deleted"
                   : "Customer deleted",
        function (f) {
          f.customers = f.customers.filter(function (x) { return x.id !== c.id; });
          if (alsoJobs) f.jobs = f.jobs.filter(function (x) { return x.customerId !== c.id; });
        });
      render();
    }

    if (!jobs.length) {
      var h0 = "<h3>Delete " + esc(c.name) + "?</h3>" +
        '<div class="sub mt">They have no jobs against them, so nothing else is affected. ' +
        "This removes them from the phone and the PC both, and it cannot be undone.</div>";
      openSheet("Delete customer", h0, [
        { label: "Cancel", on: function () { custSheet(c.id); } },
        { label: "Delete", cls: "d", on: function () { wipe(false); } }
      ]);
      return;
    }

    var h = "<h3>Delete " + esc(c.name) + "?</h3>" +
      '<div class="sub mt">They have <b>' + jobs.length + " job" + (jobs.length === 1 ? "" : "s") +
      "</b> against them, worth <b>" + money2(worth) + "</b>. Pick what happens to those.</div>" +
      '<hr class="sep">' +
      '<div class="card" style="margin-bottom:10px;background:var(--panel2)">' +
        "<b>Delete the jobs as well</b>" +
        '<div class="tiny mt">The whole history goes. The ' + money2(worth) +
        " comes off your figures for those years. Use this for a duplicate or a mistake.</div>" +
        '<button class="btn d full mt" data-all>Delete the lot</button>' +
      "</div>" +
      '<div class="card" style="background:var(--panel2)">' +
        "<b>Keep the jobs</b>" +
        '<div class="tiny mt">The money stays in your books, but ' +
        (jobs.length === 1 ? "that job will read" : "those " + jobs.length + " jobs will read") +
        ' "(unknown)" from now on, here and in Window OS. Only worth it if you need the income recorded.</div>' +
        '<button class="btn full mt" data-keep>Delete the customer only</button>' +
      "</div>";

    openSheet("Delete customer", h, [
      { label: "Cancel", cls: "p", on: function () { custSheet(c.id); } }
    ]);

    /* The two cards above already spell out exactly what each choice does, so
       a dialog on top is one more thing to tap through without reading. The
       undo offer is the safety net instead. */
    on("[data-all]", function () { wipe(true); }, $("#sheetBody"));

    on("[data-keep]", function () { wipe(false); }, $("#sheetBody"));
  }

  function editCustomer(c) {
    var isNew = !c;
    c = c || { name: "", phone: "", email: "", suburb: "", source: "", freqMonths: 0, notes: "" };
    var h = field("Name", "cf_name", "text", null, c.name) +
      '<div class="grid2">' +
        field("Phone", "cf_phone", "tel", null, c.phone) +
        field("Suburb", "cf_sub", "text", null, c.suburb) +
      "</div>" +
      field("Email", "cf_email", "email", null, c.email) +
      '<div class="grid2">' +
        field("Came from", "cf_src", "text", null, c.source) +
        field("Every (months)", "cf_freq", "number", null, c.freqMonths, ' inputmode="numeric"') +
      "</div>" +
      field("Notes", "cf_notes", "textarea", null, c.notes,
        ' placeholder="Gate code, dog, where the tap is..."');

    openSheet(isNew ? "New customer" : "Edit customer", h, [
      { label: "Cancel", on: closeSheet },
      { label: "Save", cls: "p", on: function () {
          var name = val("cf_name");
          if (!name) { toast("Needs a name"); document.getElementById("cf_name").focus(); return; }
          var ok = commit(function (f) {
            var rec = { name: name, phone: val("cf_phone"), email: val("cf_email"),
                        suburb: val("cf_sub"), source: val("cf_src"),
                        freqMonths: int("cf_freq"), notes: val("cf_notes") };
            if (isNew) { rec.id = uid(); f.customers.push(rec); }
            else f.customers.forEach(function (x) { if (x.id === c.id) Object.assign(x, rec); });
          });
          if (ok) { closeSheet(); toast("Saved"); render(); }
        } }
    ]);
  }

  /* --------------------------------------------------------- WEBSITE INBOX
     Enquiries off the website land here, not in the leads list. Everything in
     here was typed by a stranger, so nothing gets into the books until it has
     been looked at - which also means the worst a spammer can manage is
     wasting one tap.
     --------------------------------------------------------------------- */

  var inboxCache = null, inboxError = null, inboxLoading = false;

  function loadInbox(force) {
    if (inboxLoading) return;
    if (inboxCache && !force) return;
    if (!FNWCSync.isOn()) { inboxError = "signin"; return; }
    inboxLoading = true;
    FNWCEnquiry.list(FNWCSync).then(function (list) {
      inboxCache = list; inboxError = null; inboxLoading = false;
      if (view === "inbox") render(); else drawNav();
    })["catch"](function (e) {
      inboxLoading = false;
      inboxError = (e && e.message) || "Could not read the inbox";
      if (view === "inbox") render();
    });
  }

  function vInbox(root) {
    if (!FNWCSync.isOn()) {
      html(root, '<div class="card">' + empty("\u{1F510}", "Sign in to see the inbox",
        "Website enquiries are kept in the same place your data syncs through.") + "</div>");
      html(root, '<button class="btn p full" id="ibSignin">Sign in</button>');
      document.getElementById("ibSignin").onclick = function () { FNWCSync.openPanel(); };
      return;
    }

    html(root, '<div class="rowx" style="margin-bottom:12px">' +
      '<button class="btn sm" id="ibRefresh">' + (inboxLoading ? "Checking..." : "Check now") + "</button>" +
      '<span class="tiny" style="margin-left:auto">' +
      (inboxCache ? inboxCache.length + " waiting" : "") + "</span></div>");

    document.getElementById("ibRefresh").onclick = function () { loadInbox(true); render(); };

    if (inboxError && inboxError !== "signin") {
      html(root, '<div class="card" style="border-color:var(--warn)">' +
        "<h3>Could not read the inbox</h3>" +
        '<div class="sub mt">' + esc(inboxError) + "</div>" +
        '<div class="tiny mt">If this says permission denied, the Firestore rule for enquiries ' +
        "has not been added yet. It is written out in SETUP-ENQUIRIES.md.</div></div>");
      return;
    }

    if (!inboxCache) {
      html(root, '<div class="card">' + empty("\u{1F4EC}", "Checking...", "") + "</div>");
      loadInbox();
      return;
    }

    if (!inboxCache.length) {
      html(root, '<div class="card">' + empty("\u{1F4EC}", "Nothing waiting",
        "Enquiries from the website land here. You accept them before they become leads.") + "</div>");
      return;
    }

    inboxCache.forEach(function (e) {
      var junk = FNWCEnquiry.looksLikeJunk(e);
      var est = +e.estimate || 0;
      html(root, '<div class="card" data-enq="' + esc(e.id) + '"' +
        (junk ? ' style="opacity:.6"' : "") + ">" +
        '<div class="spread"><h3>' + esc(e.name || "(no name)") + "</h3>" +
        (junk ? '<span class="tag bad">looks like junk</span>'
              : est ? '<span class="tag info">' + money(est) + "</span>" : "") + "</div>" +
        '<div class="sub" style="margin:4px 0 8px">' +
          [e.suburb, e.windows ? e.windows + " windows" : "", e.storeys ? e.storeys + " storey" : "", e.sides]
            .filter(Boolean).map(esc).join(" &middot; ") + "</div>" +
        (e.notes ? '<div class="tiny" style="margin-bottom:8px">' + esc(e.notes) + "</div>" : "") +
        '<div class="wrap" style="margin-bottom:10px">' +
          (e.phone ? '<a class="btn sm" href="tel:' + esc(tel(e.phone)) + '">' + esc(e.phone) + "</a>" : "") +
          (e.email ? '<a class="btn sm" href="mailto:' + esc(e.email) + '">Email</a>' : "") +
          (e.sentAt ? '<span class="tag">' + esc(niceDate(String(e.sentAt).slice(0, 10))) + "</span>" : "") +
        "</div>" +
        '<div class="grid2">' +
          '<button class="btn p" data-accept>Add as a lead</button>' +
          '<button class="btn d" data-bin>Bin it</button>' +
        "</div></div>");
    });

    root.querySelectorAll("[data-enq]").forEach(function (card) {
      var id = card.dataset.enq;
      var e = inboxCache.filter(function (x) { return x.id === id; })[0];

      card.querySelector("[data-accept]").onclick = function () {
        var lead = FNWCEnquiry.toLead(e, qset, todayISO(), uid);
        if (!commit(function (f) { f.leads.push(lead); })) return;
        /* Off the server once it is safely in the store, not before. */
        FNWCEnquiry.remove(FNWCSync, id)["catch"](function () {});
        inboxCache = inboxCache.filter(function (x) { return x.id !== id; });
        toast("Added to leads"); render();
      };

      /* This one lives on the server, so there is no local snapshot to put
         back. It disappears from the list straight away and the actual delete
         is held until the undo offer has run out. */
      card.querySelector("[data-bin]").onclick = function () {
        var kept = e;
        inboxCache = inboxCache.filter(function (x) { return x.id !== id; });
        render();

        var t = $("#toast");
        t.textContent = "";
        t.appendChild(document.createTextNode("Binned"));
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = "Undo";
        var gone = false;
        b.onclick = function () {
          gone = true;
          clearTimeout(t._binH);
          t.className = "";
          inboxCache = (inboxCache || []).concat([kept]);
          toast("Put back"); render();
        };
        t.appendChild(b);
        t.className = "show act";

        clearTimeout(t._binH);
        t._binH = setTimeout(function () {
          t.className = "";
          if (gone) return;
          FNWCEnquiry.remove(FNWCSync, id)["catch"](function () {
            /* The server refused, so put it back rather than pretend. */
            inboxCache = (inboxCache || []).concat([kept]);
            toast("Could not bin it"); render();
          });
        }, 6000);
      };
    });
  }

  /* ------------------------------------------------------------ FOLLOW UPS
     The two jobs that make the most money and get done the least: getting
     people back in, and asking the happy ones for a review. Both are ten
     minutes of texting that nobody ever quite gets around to, so the whole
     screen is built to be worked top to bottom in one sitting.
     --------------------------------------------------------------------- */

  /* iOS wants sms:number&body=, Android wants sms:number?body=. Putting "?&"
     in keeps both of them happy, which is a well-worn hack rather than
     anything clever. */
  function smsLink(phone, body) {
    return "sms:" + tel(phone) + "?&body=" + encodeURIComponent(body);
  }

  function vFollowups(root) {
    var today = todayISO();
    var tab = state.ft || "rebook";
    var rebook = FNWCFollowUps.rebooks(db, today);
    var revs = FNWCFollowUps.reviews(db, today);
    var sum = FNWCFollowUps.summary(db, today);

    html(root, '<div class="grid3" style="margin-bottom:12px">' +
      '<div class="stat"><b>' + rebook.length + "</b><span>to chase</span></div>" +
      '<div class="stat"><b class="money">' + money(sum.expected) + "</b><span>likely worth</span></div>" +
      '<div class="stat"><b>' + revs.length + "</b><span>to ask</span></div>" +
      "</div>");

    html(root, '<div class="seg" style="margin-bottom:12px">' +
      '<button data-ft="rebook" class="' + (tab === "rebook" ? "on" : "") + '">Rebook' +
        (rebook.length ? " (" + rebook.length + ")" : "") + "</button>" +
      '<button data-ft="review" class="' + (tab === "review" ? "on" : "") + '">Reviews' +
        (revs.length ? " (" + revs.length + ")" : "") + "</button>" +
      "</div>");

    if (tab === "rebook") drawRebooks(root, rebook, today);
    else drawReviews(root, revs, today);

    on("[data-ft]", function (e) { state.ft = e.dataset.ft; render(); }, root);
  }

  var STATE_TAG = { soon: "info", overdue: "warn", atrisk: "bad" };
  var STATE_WORD = { soon: "due soon", overdue: "overdue", atrisk: "drifting away" };

  function drawRebooks(root, list, today) {
    if (!list.length) {
      var parked = FNWCFollowUps.rebookSkipped(db, today);
      html(root, '<div class="card">' + empty("✅", "Nobody to chase",
        "Everyone on a cycle is either booked in or not due yet.") + "</div>");
      /* An empty screen should say why it is empty, or it just looks broken. */
      if (parked.length) {
        html(root, '<div class="card"><h3 style="margin-bottom:8px">Parked for now</h3>' +
          parked.map(function (p) {
            return '<div class="q-line"><span>' + esc(p.customer.name) + "</span>" +
                   '<b class="tiny">' + esc(p.reason) + "</b></div>";
          }).join("") + "</div>");
      }
      return;
    }

    html(root, '<div class="tiny" style="margin-bottom:10px">Work down the list. Each one opens a ' +
      "text with the message already written.</div>");

    list.forEach(function (r) {
      var c = r.customer;
      html(root, '<div class="card" data-rb="' + esc(c.id) + '">' +
        '<div class="spread"><h3>' + esc(c.name) + "</h3>" +
        '<span class="tag ' + (STATE_TAG[r.state] || "") + '">' + STATE_WORD[r.state] + "</span></div>" +
        '<div class="sub" style="margin:6px 0 8px">' + esc(r.why) + "</div>" +
        '<div class="wrap" style="margin-bottom:10px">' +
          '<span class="tag">' + esc(c.suburb || "no suburb") + "</span>" +
          '<span class="tag">' + money(r.value) + " a clean</span>" +
          '<span class="tag">every ' + esc(c.freqMonths) + " months</span>" +
        "</div>" +
        '<div class="grid2">' +
          (c.phone ? '<a class="btn p" data-text href="' + esc(smsLink(c.phone, r.message)) + '">Text them</a>'
                   : '<button class="btn" data-nonum>No phone number</button>') +
          '<button class="btn" data-copy>Copy text</button>' +
        "</div>" +
        '<div class="wrap mt">' +
          '<button class="chip" data-booked>They booked</button>' +
          '<button class="chip" data-snooze>Not yet</button>' +
          '<button class="chip" data-stop>Stop asking</button>' +
        "</div></div>");
    });

    root.querySelectorAll("[data-rb]").forEach(function (card) {
      var cid = card.dataset.rb;
      var r = list.filter(function (x) { return x.customer.id === cid; })[0];
      var c = r.customer;

      var asked = function (msg) {
        if (commit(function (f) { FNWCFollowUps.markRebookAsked(f, cid, todayISO()); })) {
          toast(msg); render();
        }
      };

      var t = card.querySelector("[data-text]");
      /* Opening the messages app counts as having asked. Over-marking by one
         is far better than texting somebody twice in a week. */
      if (t) t.onclick = function () { setTimeout(function () { asked("Marked as asked"); }, 700); };

      var nn = card.querySelector("[data-nonum]");
      if (nn) nn.onclick = function () { toast("No number saved - add one on their card"); };

      card.querySelector("[data-copy]").onclick = function () {
        copy(r.message); asked("Copied, and marked as asked");
      };

      card.querySelector("[data-booked]").onclick = function () {
        /* Straight into a new job for them, which is the whole point. */
        if (!commit(function (f) { FNWCFollowUps.markRebookAsked(f, cid, todayISO()); })) return;
        editJob({ id: "", customerId: cid, date: todayISO(), suburb: c.suburb || "",
                  services: "", price: Math.round(r.value) || "", estMin: "",
                  travelMin: db.settings.travelDefault || 30, km: "", status: "scheduled", actualMin: "" });
      };

      card.querySelector("[data-snooze]").onclick = function () { snoozeSheet(c); };

      card.querySelector("[data-stop]").onclick = function () {
        doWithUndo("Will not chase " + FNWCFollowUps.firstName(c) + " again", function (f) {
          FNWCFollowUps.stopRebook(f, cid, true);
        });
        render();
      };
    });
  }

  function snoozeSheet(c) {
    var h = '<div class="sub">When should ' + esc(FNWCFollowUps.firstName(c)) +
      " come back up? They drop off the list until then.</div>" +
      '<div class="wrap mt">' +
        [[14, "2 weeks"], [30, "1 month"], [60, "2 months"], [90, "3 months"], [180, "6 months"]]
          .map(function (o) { return '<button class="chip" data-d="' + o[0] + '">' + o[1] + "</button>"; })
          .join("") + "</div>";
    openSheet("Not yet", h, [{ label: "Cancel", on: closeSheet }]);
    on("[data-d]", function (e) {
      var d = parseInt(e.dataset.d, 10);
      if (commit(function (f) { FNWCFollowUps.snoozeRebook(f, c.id, d, todayISO()); })) {
        closeSheet(); toast("Back in " + d + " days"); render();
      }
    }, $("#sheetBody"));
  }

  function drawReviews(root, list, today) {
    var url = (db.settings || {}).reviewUrl;
    if (!url) {
      html(root, '<div class="card" style="border-color:var(--warn)">' +
        "<h3>Add your Google review link first</h3>" +
        '<div class="sub mt">Without it the message just asks people to go and find you, ' +
        "and almost nobody does. It is the single thing that decides whether this works.</div>" +
        '<button class="btn p full mt" data-seturl>Add the link</button></div>');
      on("[data-seturl]", function () { reviewUrlSheet(); }, root);
    }

    if (!list.length) {
      html(root, '<div class="card">' + empty("⭐", "Nobody to ask right now",
        "People show up here a couple of days after you finish their job.") + "</div>");
      return;
    }

    html(root, '<div class="tiny" style="margin-bottom:10px">Asked once each, not once a clean. ' +
      "Regulars are at the top - they are the ones who actually write them.</div>");

    list.forEach(function (r) {
      var c = r.customer;
      html(root, '<div class="card" data-rv="' + esc(c.id) + '">' +
        '<div class="spread"><h3>' + esc(c.name) + "</h3>" +
        (r.repeat ? '<span class="tag good">' + r.jobCount + " cleans</span>"
                  : '<span class="tag">first clean</span>') + "</div>" +
        '<div class="sub" style="margin:6px 0 10px">' + esc(r.why) + "</div>" +
        '<div class="grid2">' +
          (c.phone ? '<a class="btn p" data-text href="' + esc(smsLink(c.phone, r.message)) + '">Text them</a>'
                   : '<button class="btn" data-nonum>No phone number</button>') +
          '<button class="btn" data-copy>Copy text</button>' +
        "</div>" +
        '<div class="wrap mt">' +
          '<button class="chip" data-left>They left one</button>' +
          '<button class="chip" data-never>Do not ask</button>' +
        "</div></div>");
    });

    root.querySelectorAll("[data-rv]").forEach(function (card) {
      var cid = card.dataset.rv;
      var r = list.filter(function (x) { return x.customer.id === cid; })[0];

      var mark = function (st, msg) {
        if (commit(function (f) { FNWCFollowUps.markReview(f, cid, st, todayISO()); })) {
          toast(msg); render();
        }
      };

      var t = card.querySelector("[data-text]");
      if (t) t.onclick = function () { setTimeout(function () { mark("asked", "Marked as asked"); }, 700); };

      var nn = card.querySelector("[data-nonum]");
      if (nn) nn.onclick = function () { toast("No number saved - add one on their card"); };

      card.querySelector("[data-copy]").onclick = function () {
        copy(r.message); mark("asked", "Copied, and marked as asked");
      };
      card.querySelector("[data-left]").onclick = function () { mark("done", "Good one. Never asked again"); };
      card.querySelector("[data-never]").onclick = function () { mark("off", "Will not ask them"); };
    });
  }

  function reviewUrlSheet() {
    var h = field("Your Google review link", "ru_url", "url", null, (db.settings || {}).reviewUrl || "",
      ' placeholder="https://g.page/r/..."') +
      '<div class="tiny">On the PC, search Google for Far North Window Cleaning, open your business ' +
      'profile, and use <b>Ask for reviews</b> - it gives you a short link. Paste it here once and every ' +
      "review message from now on has it in.</div>";
    openSheet("Google review link", h, [
      { label: "Cancel", on: closeSheet },
      { label: "Save", cls: "p", on: function () {
          var u = val("ru_url");
          if (u && !/^https?:\/\//i.test(u)) { toast("Needs to start with https://"); return; }
          if (commit(function (f) { f.settings = f.settings || {}; f.settings.reviewUrl = u; })) {
            closeSheet(); toast(u ? "Link saved" : "Link cleared"); render();
          }
        } }
    ]);
  }

  /* The run for one day, in the order that does the least driving. It does not
     reorder anything in the diary - the jobs have no times on them, so the
     order is advice, not a schedule. */
  function routeSheet(dateISO) {
    var plan = FNWCGeo.planDay(db, dateISO);
    var base = FNWCGeo.basePoint(db);

    var h = '<div class="wrap" style="margin-bottom:12px">' +
      '<span class="tag">' + plan.km + " km</span>" +
      '<span class="tag">' + Math.round(plan.driveMinutes) + " min driving</span>" +
      '<span class="tag">' + money2(plan.fuelCost) + " fuel</span>" +
      (plan.kmSaved > 0 ? '<span class="tag good">saves ' + plan.kmSaved + " km</span>" : "") +
      "</div>";

    h += '<div class="q-line"><span>Start</span><b>' + esc(titleCase(base ? base.name : "base")) + "</b></div>";
    plan.stops.forEach(function (s, i) {
      h += '<div class="q-line"><span>' + (i + 1) + ". " +
           esc(s.customer ? s.customer.name : "(unknown)") + '<br><span class="tiny">' +
           esc(titleCase(s.suburb)) + "</span></span>" +
           '<b class="tiny">' + s.kmFromPrevious + " km &middot; " + s.minutesFromPrevious + " min</b></div>";
    });
    h += '<div class="q-line"><span>Home</span><b class="tiny">' +
         (Math.round((plan.km - plan.stops.reduce(function (a, s) { return a + s.kmFromPrevious; }, 0)) * 10) / 10) +
         " km</b></div>";

    if (plan.unplaced.length) {
      h += '<div class="tiny mt">Not included, because the map has not heard of them: ' +
        esc(plan.unplaced.map(function (u) { return u.suburb || "(no suburb)"; }).join(", ")) + ".</div>";
    }
    h += '<div class="tiny mt">Driving times are estimates from suburb to suburb. They do not know about ' +
      "roadworks or the school run, so leave yourself room.</div>";

    openSheet(niceDate(dateISO), h, [
      { label: "Copy the run", on: function () {
          var L = ["Run for " + niceDate(dateISO), ""];
          plan.stops.forEach(function (s, i) {
            L.push((i + 1) + ". " + (s.customer ? s.customer.name : "(unknown)") +
                   " - " + titleCase(s.suburb) +
                   (s.job.services ? " (" + s.job.services + ")" : ""));
          });
          L.push("");
          L.push(plan.km + " km, about " + Math.round(plan.driveMinutes) + " min driving.");
          copy(L.join("\n"));
        } },
      { label: "Close", cls: "p", on: closeSheet }
    ]);
  }

  /* Putting an unknown suburb on the map by naming one it sits next to. No
     coordinates to type, and it only ever has to be done once per place. */
  function placeSheet(name) {
    var h = '<div class="sub">The map has not heard of <b>' + esc(titleCase(name)) + "</b>. " +
      "Name somewhere it is near and it will be treated as being in the same spot.</div>" +
      field("It is near", "pl_near", "text", null, "",
        ' list="subList2" placeholder="Trinity Beach"') +
      '<datalist id="subList2">' + FNWCGeo.suburbNames().map(function (s) {
        return '<option value="' + esc(titleCase(s)) + '">';
      }).join("") + "</datalist>" +
      '<div class="tiny" id="pl_note"></div>';

    openSheet("Place " + titleCase(name), h, [
      { label: "Cancel", on: closeSheet },
      { label: "Save", cls: "p", on: function () {
          var near = val("pl_near");
          if (!FNWCGeo.lookup(near, db)) { toast("Do not know that one either"); return; }
          if (commit(function (f) { FNWCGeo.placeSuburb(f, name, near); })) {
            closeSheet(); toast(titleCase(name) + " is on the map"); render();
          }
        } }
    ]);

    var inp = document.getElementById("pl_near"), note = document.getElementById("pl_note");
    inp.addEventListener("input", function () {
      var p = FNWCGeo.lookup(inp.value, db);
      note.textContent = p ? "Found: " + titleCase(p.name) + " (" + p.zone + ")" : "";
      note.style.color = "var(--good)";
    });
  }

  function titleCase(s) {
    return String(s || "").replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
  }

  /* ----------------------------------------------------------- GETTING PAID
     Money already earned, sitting in someone else's bank account. Two halves:
     work you have not invoiced yet, which is entirely your own doing, and
     invoices nobody has paid, which is not.
     --------------------------------------------------------------------- */

  var PAY_TAG = { awaiting: "", due: "info", overdue: "warn", serious: "bad", call: "bad" };
  var PAY_WORD = { awaiting: "not due yet", due: "due today", overdue: "late",
                   serious: "well overdue", call: "ring them" };

  function vMoney(root) {
    var today = todayISO();
    var tab = state.mt || "chase";
    var m = FNWCMoney.summary(db, today);
    var ub = FNWCMoney.unbilled(db, today);
    var chase = FNWCMoney.toChase(db, today);
    var owed = FNWCMoney.outstanding(db, today);

    html(root, '<div class="grid3" style="margin-bottom:12px">' +
      '<div class="stat"><b class="money">' + money(m.owed) + "</b><span>owed to you</span></div>" +
      '<div class="stat"><b class="money">' + money(m.overdueValue) + "</b><span>overdue</span></div>" +
      '<div class="stat"><b class="money">' + money(m.unbilledValue) + "</b><span>not invoiced</span></div>" +
      "</div>");

    if (m.avgDaysToPay != null) {
      html(root, '<div class="tiny" style="margin-bottom:10px">People take about <b>' +
        m.avgDaysToPay + " day" + (m.avgDaysToPay === 1 ? "" : "s") + "</b> to pay you" +
        (m.oldest != null ? ". Your oldest unpaid is <b>" + m.oldest + " days</b> late." : ".") + "</div>");
    }

    html(root, '<div class="seg" style="margin-bottom:12px">' +
      '<button data-mt="chase" class="' + (tab === "chase" ? "on" : "") + '">Chase' +
        (chase.length ? " (" + chase.length + ")" : "") + "</button>" +
      '<button data-mt="invoice" class="' + (tab === "invoice" ? "on" : "") + '">To invoice' +
        (ub.length ? " (" + ub.length + ")" : "") + "</button>" +
      '<button data-mt="owed" class="' + (tab === "owed" ? "on" : "") + '">All owed' +
        (owed.length ? " (" + owed.length + ")" : "") + "</button>" +
      "</div>");

    if (tab === "chase") drawChase(root, chase);
    else if (tab === "invoice") drawUnbilled(root, ub);
    else drawOwed(root, owed);

    on("[data-mt]", function (e) { state.mt = e.dataset.mt; render(); }, root);
  }

  function drawUnbilled(root, list) {
    if (!list.length) {
      html(root, '<div class="card">' + empty("✅", "Everything is invoiced",
        "Nothing finished is waiting to be sent out.") + "</div>");
      return;
    }
    html(root, '<div class="tiny" style="margin-bottom:10px">The clock on getting paid does not ' +
      "start until the invoice goes out. Issuing one here numbers it and sets the due date.</div>");

    list.forEach(function (u) {
      var c = u.customer;
      html(root, '<div class="card" data-ub="' + esc(u.job.id) + '">' +
        '<div class="spread"><h3>' + esc(c ? c.name : "(unknown)") + "</h3>" +
        '<b class="money">' + money2(u.amount) + "</b></div>" +
        '<div class="sub" style="margin:6px 0 10px">' + esc(u.why) + "</div>" +
        (u.job.services ? '<div class="tiny" style="margin-bottom:10px">' + esc(u.job.services) + "</div>" : "") +
        '<button class="btn p full" data-issue>Issue the invoice</button>' +
        '<div class="wrap mt">' +
          '<button class="chip" data-already>Already sent it</button>' +
          '<button class="chip" data-paidnow>Paid in cash</button>' +
        "</div></div>");
    });

    root.querySelectorAll("[data-ub]").forEach(function (card) {
      var jid = card.dataset.ub;
      var u = list.filter(function (x) { return x.job.id === jid; })[0];

      card.querySelector("[data-issue]").onclick = function () { issueSheet(u); };

      card.querySelector("[data-already]").onclick = function () {
        if (commit(function (f) { FNWCMoney.markInvoiced(f, jid, todayISO()); })) {
          toast("Marked as invoiced"); render();
        }
      };
      card.querySelector("[data-paidnow]").onclick = function () {
        /* Cash on the day skips the invoice entirely, which is most of the
           small jobs - it should not need three taps. */
        if (commit(function (f) {
          FNWCMoney.markInvoiced(f, jid, todayISO());
          FNWCMoney.markPaid(f, jid, todayISO());
        })) { toast("Paid. Nice one"); render(); }
      };
    });
  }

  function issueSheet(u) {
    var c = u.customer;
    var no = FNWCMoney.nextInvoiceNo(db);
    var terms = parseInt((db.settings || {}).invoiceTerms, 10);
    if (!isFinite(terms)) terms = 7;
    var due = FNWCMoney._addDays(todayISO(), terms);

    var h = '<div class="spread"><h3>' + esc(c ? c.name : "(unknown)") + "</h3>" +
      '<b class="money">' + money2(u.amount) + "</b></div>" +
      '<hr class="sep">' +
      '<div class="q-line"><span>Invoice number</span><b>' + esc(no) + "</b></div>" +
      '<div class="q-line"><span>Issued</span><b>' + esc(niceDate(todayISO())) + "</b></div>" +
      '<div class="q-line"><span>Due</span><b>' + esc(niceDate(due)) + " (" + terms + " days)</b></div>" +
      (u.job.services ? '<div class="sub mt">' + esc(u.job.services) + "</div>" : "") +
      '<div class="tiny mt">This records the invoice against the job so it can be chased. ' +
      "To send a proper printed one, open the invoice maker on the PC and pull this job up - " +
      "it will already have the number on it.</div>";

    openSheet("Issue invoice", h, [
      { label: "Cancel", on: closeSheet },
      { label: "Issue it", cls: "p", on: function () {
          if (commit(function (f) { FNWCMoney.markInvoiced(f, u.job.id, todayISO(), no); })) {
            closeSheet(); toast("Invoice " + no + " issued"); render();
          }
        } }
    ]);
  }

  function drawChase(root, list) {
    if (!list.length) {
      html(root, '<div class="card">' + empty("\u{1F44C}", "Nobody to chase",
        "Nothing is overdue, or everyone late has been reminded in the last week.") + "</div>");
      return;
    }
    html(root, '<div class="tiny" style="margin-bottom:10px">Reminders get firmer as they age. ' +
      "Anything over a month suggests a call instead, because texts have stopped working by then.</div>");

    list.forEach(function (o) {
      var c = o.customer;
      html(root, '<div class="card" data-ch="' + esc(o.job.id) + '">' +
        '<div class="spread"><h3>' + esc(c ? c.name : "(unknown)") + "</h3>" +
        '<span class="tag ' + (PAY_TAG[o.state] || "") + '">' + PAY_WORD[o.state] + "</span></div>" +
        '<div class="rowx" style="margin:6px 0"><b class="money" style="font-size:20px">' + money2(o.amount) + "</b>" +
          '<span class="tiny" style="margin-left:auto">' + (o.invoiceNo ? esc(o.invoiceNo) + " &middot; " : "") +
          "due " + esc(niceDate(o.dueAt)) + "</span></div>" +
        '<div class="sub" style="margin-bottom:10px">' + esc(o.why) +
          (o.reminders ? " Reminded " + o.reminders + " time" + (o.reminders === 1 ? "" : "s") +
           ", last " + esc(niceDate(o.remindedAt)) + "." : "") + "</div>" +
        '<div class="grid2">' +
          (c && c.phone
            ? (o.byPhone
                ? '<a class="btn p" href="tel:' + esc(tel(c.phone)) + '" data-call>Ring them</a>'
                : '<a class="btn p" href="' + esc(smsLink(c.phone, o.message)) + '" data-text>Send reminder</a>')
            : '<button class="btn" data-nonum>No phone number</button>') +
          '<button class="btn" data-copy>Copy text</button>' +
        "</div>" +
        '<div class="wrap mt">' +
          '<button class="chip" data-paid>They paid</button>' +
          '<button class="chip" data-noted>Chased it</button>' +
        "</div></div>");
    });

    root.querySelectorAll("[data-ch]").forEach(function (card) {
      var jid = card.dataset.ch;
      var o = list.filter(function (x) { return x.job.id === jid; })[0];

      var chased = function (msg) {
        if (commit(function (f) { FNWCMoney.markReminded(f, jid, todayISO()); })) { toast(msg); render(); }
      };

      var t = card.querySelector("[data-text]") || card.querySelector("[data-call]");
      if (t) t.onclick = function () { setTimeout(function () { chased("Marked as chased"); }, 700); };

      var nn = card.querySelector("[data-nonum]");
      if (nn) nn.onclick = function () { toast("No number saved - add one on their card"); };

      card.querySelector("[data-copy]").onclick = function () {
        copy(o.message); chased("Copied, and marked as chased");
      };
      card.querySelector("[data-noted]").onclick = function () { chased("Marked as chased"); };
      card.querySelector("[data-paid]").onclick = function () {
        if (commit(function (f) { FNWCMoney.markPaid(f, jid, todayISO()); })) {
          toast("Paid. " + money2(o.amount) + " in"); render();
        }
      };
    });
  }

  function drawOwed(root, list) {
    if (!list.length) {
      html(root, '<div class="card">' + empty("\u{1F3E6}", "Nothing outstanding",
        "Every invoice you have sent has been paid.") + "</div>");
      return;
    }
    list.forEach(function (o) {
      var c = o.customer;
      html(root, '<div class="item" data-job="' + esc(o.job.id) + '"><div class="rowx">' +
        '<div style="min-width:0"><div class="t">' + esc(c ? c.name : "(unknown)") + "</div>" +
        '<div class="m">' + (o.invoiceNo ? esc(o.invoiceNo) + " &middot; " : "") +
        "due " + esc(niceDate(o.dueAt)) + "</div></div>" +
        '<div class="r"><div style="font-weight:700" class="money">' + money2(o.amount) + "</div>" +
        '<div class="tag ' + (PAY_TAG[o.state] || "") + '" style="margin-top:5px">' + PAY_WORD[o.state] + "</div>" +
        "</div></div></div>");
    });
    wireJobCards(root);
  }

  /* ------------------------------------------------------- ARE YOU CHARGING
     ENOUGH. Every finished job with a real time on it is a completed
     experiment. This is what they add up to. It states how much it is going on
     and refuses to guess from three jobs, because a confident wrong answer
     about your prices is worse than no answer.
     --------------------------------------------------------------------- */

  var CONF_WORD = { none: "not enough yet", early: "early days", fair: "reasonable", good: "solid" };
  var CONF_TAG = { none: "bad", early: "warn", fair: "info", good: "good" };

  function vPricing(root) {
    var r = FNWCCalibrate.report(db);
    var cov = r.coverage;

    html(root, '<div class="grid3" style="margin-bottom:12px">' +
      '<div class="stat"><b class="money">' + (r.rate.rate != null ? money(r.rate.rate) : "—") +
        "</b><span>an hour, real</span></div>" +
      '<div class="stat"><b class="money">' + money(r.rate.target) + "</b><span>you aimed at</span></div>" +
      '<div class="stat"><b>' + cov.logged + "/" + cov.total + "</b><span>jobs timed</span></div>" +
      "</div>");

    html(root, '<div class="card" style="padding:10px 12px;margin-bottom:12px">' +
      '<div class="rowx"><span class="tiny">Based on ' + cov.logged + " timed job" +
      (cov.logged === 1 ? "" : "s") + '</span>' +
      '<span class="tag ' + CONF_TAG[cov.confidence] + '" style="margin-left:auto">' +
      CONF_WORD[cov.confidence] + "</span></div></div>");

    if (!r.usable) {
      html(root, '<div class="card">' + empty("\u{1F4C8}", "Not enough to go on yet",
        cov.needed + " more finished job" + (cov.needed === 1 ? "" : "s") +
        " with a real time on them and this starts working.") + "</div>");
      if (cov.missing) drawUntimed(root, FNWCCalibrate.missing(db));
      return;
    }

    /* What to do about it, most worth doing first. */
    r.actions.forEach(function (a) {
      html(root, '<div class="card" data-act="' + esc(a.kind) + '">' +
        "<h3>" + esc(a.title) + "</h3>" +
        '<div class="sub" style="margin-top:6px">' + esc(a.detail) + "</div>" +
        (a.kind === "time" && a.factor
          ? '<button class="btn p full mt" data-accept="' + a.factor + '">Use this in quotes</button>'
          : "") +
        (a.kind === "travel" ? '<a class="btn full mt" href="#diary">Look at the diary</a>' : "") +
        "</div>");
    });

    if (r.appliedFactor !== 1) {
      html(root, '<div class="card" style="border-color:var(--good)">' +
        "<h3>Quotes are being padded by " + Math.round((r.appliedFactor - 1) * 100) + "%</h3>" +
        '<div class="sub mt">The quote screen adds this to its time estimate, so the hourly rate it ' +
        "shows you is the one you will really get. It does not change the price it quotes.</div>" +
        '<button class="btn full mt" data-clearfactor>Stop padding</button></div>');
    }

    /* Where the money is actually made. Averages hide this; it is usually one
       suburb or one kind of job dragging everything down. */
    var subs = FNWCCalibrate.bySuburb(db);
    if (subs.length > 1) {
      html(root, '<div class="card"><h3>By suburb</h3>' +
        '<div class="tiny" style="margin:4px 0 8px">Only places with three or more timed jobs.</div>' +
        subs.map(function (s) {
          var tag = s.rate >= r.rate.target ? "good" : s.rate >= r.rate.target * 0.8 ? "warn" : "bad";
          return '<div class="q-line"><span>' + esc(titleCase(s.key)) +
            ' <span class="tiny">' + s.n + " jobs</span></span>" +
            '<b><span class="tag ' + tag + '">' + money(s.rate) + "/h</span></b></div>";
        }).join("") + "</div>");
    }

    var kinds = FNWCCalibrate.byKind(db);
    if (kinds.length > 1) {
      html(root, '<div class="card"><h3>By kind of job</h3>' +
        kinds.map(function (s) {
          var tag = s.rate >= r.rate.target ? "good" : s.rate >= r.rate.target * 0.8 ? "warn" : "bad";
          return '<div class="q-line"><span>' + esc(s.key) +
            ' <span class="tiny">' + s.n + " jobs</span></span>" +
            '<b><span class="tag ' + tag + '">' + money(s.rate) + "/h</span></b></div>";
        }).join("") + "</div>");
    }

    var o = FNWCCalibrate.outliers(db, 3);
    if (o.worst.length) {
      html(root, '<div class="card"><h3>Worst paying jobs</h3>' +
        '<div class="tiny" style="margin:4px 0 8px">Worth a look. Usually a long drive, or one that ' +
        "turned out to be a much bigger job than it looked.</div>" +
        o.worst.map(function (x) {
          return '<div class="q-line"><span>' + esc(custName(x.job.customerId)) +
            '<br><span class="tiny">' + esc(niceDate(x.job.date)) +
            (x.job.suburb ? " &middot; " + esc(x.job.suburb) : "") + "</span></span>" +
            '<b><span class="tag bad">' + money(x.rate) + "/h</span></b></div>";
        }).join("") + "</div>");
    }

    if (cov.missing) drawUntimed(root, FNWCCalibrate.missing(db));

    on("[data-accept]", function (e) {
      var f = parseFloat(e.dataset.accept);
      if (commit(function (fdb) { FNWCCalibrate.acceptTimeFactor(fdb, f); })) {
        toast("Quotes now padded by " + Math.round((f - 1) * 100) + "%"); render();
      }
    }, root);

    on("[data-clearfactor]", function () {
      if (commit(function (fdb) { FNWCCalibrate.clearTimeFactor(fdb); })) {
        toast("Padding removed"); render();
      }
    }, root);
  }

  function drawUntimed(root, list) {
    html(root, '<div class="card"><h3>' + list.length + " job" + (list.length === 1 ? "" : "s") +
      " with no time logged</h3>" +
      '<div class="tiny" style="margin:4px 0 10px">Each one you fill in sharpens everything above. ' +
      "Guessing from memory is fine - roughly right beats nothing.</div>" +
      list.slice(0, 12).map(function (j) {
        return '<div class="q-line"><span>' + esc(custName(j.customerId)) +
          '<br><span class="tiny">' + esc(niceDate(j.date)) + " &middot; quoted " +
          (+j.estMin || 0) + "m</span></span>" +
          '<button class="btn sm" data-logtime="' + esc(j.id) + '">Log it</button></div>';
      }).join("") + "</div>");
    on("[data-logtime]", function (e) { timeSheet(e.dataset.logtime); }, root);
  }

  /* ---------------------------------------------------------------- QUOTE */

  var COUNT_IDS = ["gStd", "gLrg", "uWin", "fly", "sec", "trk", "door"];

  function vQuote(root) {
    var q = state.q2 = state.q2 || {
      storeys: "single", groundSides: "out", upSides: "out",
      condition: "normal", travel: "local", freq: "once",
      n: { gStd: 0, gLrg: 0, uWin: 0, fly: 0, sec: 0, trk: 0, door: 0 }
    };

    function seg(key, opts) {
      return '<div class="seg" data-seg="' + key + '" style="margin-bottom:12px">' +
        opts.map(function (o) {
          return '<button data-v="' + o[0] + '" class="' + (q[key] === o[0] ? "on" : "") + '">' + o[1] + "</button>";
        }).join("") + "</div>";
    }
    function step(key, label, note) {
      return '<div class="card" style="padding:12px;margin-bottom:9px">' +

  /* The pricing below is the desktop quote calculator's, line for line. If the
     rate card changes there, change it here too - or the phone will quote a
     different number from the one on the wall. */
  function calcQuote() {
    var q = state.q2;
    var isDouble = q.storeys === "double";
    var gBoth = q.groundSides === "both", uBoth = q.upSides === "both";
    var n = Object.assign({}, q.n);
    if (!isDouble) n.uWin = 0;

    var rate = {
      gStd: gBoth ? qset.stdBoth : qset.stdOut,
      gLrg: gBoth ? qset.lrgBoth : qset.lrgOut,
      uWin: uBoth ? qset.upBoth : qset.upOut,
      fly: qset.flyscreen, sec: qset.securityScreen,
      trk: qset.track, door: qset.slidingDoor
    };

    var lines = [], work = 0;
    function add(key, label) {
      if (n[key] <= 0) return;
      var cost = n[key] * rate[key];
      lines.push([n[key] + " " + label + " × " + money2(rate[key]), cost]);
      work += cost;
    }
    add("gStd", gBoth ? "standard, in + out" : "standard, outside");
    add("gLrg", gBoth ? "large, in + out" : "large, outside");
    add("uWin", uBoth ? "upstairs, in + out" : "upstairs, outside");
    add("fly", n.fly === 1 ? "flyscreen" : "flyscreens");
    add("sec", n.sec === 1 ? "security screen" : "security screens");
    add("trk", n.trk === 1 ? "track" : "tracks");
    add("door", n.door === 1 ? "sliding door" : "sliding doors");

    var pct = q.condition === "hard" ? qset.hardPct : q.condition === "heavy" ? qset.heavyPct : 0;
    if (pct > 0 && work > 0) {
      var sur = work * (pct / 100);
      lines.push([(q.condition === "heavy" ? "Neglected property" : "Hard work") + " (+" + pct + "%)", sur]);
      work += sur;
    }

    var travelFee = q.travel === "far" ? qset.travelFee : 0;
    if (travelFee > 0) lines.push(["Travel - 45 min or more each way", travelFee]);

    var base = isDouble ? qset.minDouble : qset.minSingle;
    var first = work + travelFee, floored = false;
    if (first < base) { first = base; floored = true; }

    var discPct = q.freq === "q" ? qset.discQ : q.freq === "h" ? qset.discH : 0;
    var repeat = first * (1 - discPct / 100);
    if (repeat < base) repeat = base;

    var onSite = TIME.setup;
    onSite += n.gStd * (gBoth ? TIME.stdBoth : TIME.stdOut);
    onSite += n.gLrg * (gBoth ? TIME.lrgBoth : TIME.lrgOut);
    onSite += n.uWin * (uBoth ? TIME.upBoth : TIME.upOut);
    onSite += n.fly * TIME.flyscreen;
    onSite += n.sec * TIME.securityScreen;
    onSite += n.trk * TIME.track;
    onSite += n.door * TIME.slidingDoor;
    if (q.condition === "hard") onSite *= TIME.hardMult;
    if (q.condition === "heavy") onSite *= TIME.heavyMult;

    /* The rate card's time estimate, corrected by what jobs actually take.
       Only the hourly rate shown moves - the price quoted is still the rate
       card's, because what to charge stays a decision, not a calculation. */
    var rawOnSite = onSite;
    onSite = FNWCCalibrate.adjustMinutes(db, onSite);
    var padded = Math.round(onSite) !== Math.round(rawOnSite);

    var travelMins = (q.travel === "far" ? TIME.travelFar : TIME.travelLocal) * 2;
    var totalMins = onSite + travelMins;
    var hourly = totalMins > 0 ? first / (totalMins / 60) : 0;

    return { lines: lines, first: first, repeat: repeat, discPct: discPct, floored: floored,
             base: base, onSite: Math.round(onSite), rawOnSite: Math.round(rawOnSite),
             padded: padded, hourly: hourly, anything: work > 0,
             windows: n.gStd + n.gLrg + n.uWin };
  }

  function drawQuote() {
    var out = document.getElementById("qOut");
    if (!out) return;
    var r = calcQuote();

    if (!r.anything) {
      out.innerHTML = '<div class="card mt">' + empty("\u{1F4B2}", "Count the windows",
        "Tap the plus buttons above and the price works itself out.") + "</div>";
      return;
    }

    var target = qset.targetRate || 90;
    var rateTag = r.hourly >= target ? "good" : r.hourly >= target * 0.8 ? "warn" : "bad";

    var h = '<div class="card mt">' +
      r.lines.map(function (l) {
        return '<div class="q-line"><span>' + esc(l[0]) + '</span><b class="money">' + money2(l[1]) + "</b></div>";
      }).join("") +
      (r.floored ? '<div class="tiny mt">Under your ' + money(r.base) + " minimum, so it is the minimum.</div>" : "") +
      '<div class="q-total money">' + money(r.first) + "</div>" +
      '<div class="sub">First clean' + (r.discPct ? ", then " + money(r.repeat) + " each time after" : "") + "</div>" +
      '<div class="wrap mt">' +
        '<span class="tag">' + Math.round(r.onSite) + " min on site</span>" +
        '<span class="tag ' + rateTag + '">' + money(r.hourly) + "/h</span>" +
        '<span class="tag">' + r.windows + " windows</span>" +
      "</div>" +
      (r.padded
        ? '<div class="tiny mt">Time padded from ' + r.rawOnSite + " to " + r.onSite +
          " minutes, because your jobs have been running over. That is why the hourly rate here " +
          'is lower than the rate card suggests. <a href="#pricing">Why</a></div>'

      '<div class="grid2 mt">' +
        '<button class="btn" data-qc>Copy the words</button>' +
        '<button class="btn p" data-ql>Save as a lead</button>' +

    on("[data-qc]", function () { copy(quoteWords(r)); }, out);

  /* ---------------------------------------------------------------- REPLY */

  var TOPIC = [
    ["price",      /how much|what.{0,14}cost|price|quote|ballpark|estimate|charge|rates/i],
    ["when",       /when (can|could|would|are|will|do|might)|what days|availab|are you free|any free|fit (me|us) in|book (me|us) in|soonest|earliest|this week|next week|come (out|round|over)|get (me|us) in/i],
    ["rebook",     /again|another clean|next clean|due|regular|quarterly|every (three|3|six|6) month|same as last/i],
    ["confirm",    /confirm|still (ok|on|coming)|are we (booked|set)|see you (on|then)|what time (are|will)/i],
    ["invoice",    /invoice|receipt|pay|payment|bank details|owe|paid|bill|eftpos/i],
    ["reschedule", /reschedul|move it|move the|change the (time|day|date)|postpone|can.?t make|cancel/i],
    ["problem",    /not happy|unhappy|complain|streak|missed|disappoint|poor job|refund|still dirty|marks left|smear/i]
  ];
  var SIGNAL = [
    ["urgent",     /asap|urgent|as soon as|straight away|this week|by (friday|monday|tomorrow)|short notice|quickly/i],
    ["inspection", /inspection|open home|open house|photos|photographer|valuation|appraisal/i],
    ["selling",    /selling|on the market|sale|list(ing|ed) the (house|place)/i],
    ["moving",     /moving out|vacate|vacating|bond|end of lease|final clean|moving in/i],
    ["renovation", /renovat|builder|new build|reno|construction|paint splatter|render|plaster|dust everywhere/i],
    ["salt",       /salt|sea (air|spray)|beach ?front|ocean/i],
    ["mould",      /mould|mold|mildew|black spot/i],
    ["hardwater",  /hard water|sprinkler|water mark|calcium|mineral/i],
    ["dog",        /dog|puppy|pooch|staffy|kelpie/i],
    ["gate",       /gate|side access|code is|keypad|padlock|locked/i],
    ["notHome",    /not (be )?home|at work|won.?t be (there|here)|leave the key|key under/i],
    ["high",       /high|hard to reach|ladder|two storey|2 storey|upstairs|second storey|tall/i],
    ["commercial", /shop|office|cafe|restaurant|business premises|body corporate|strata|real estate|property manager|airbnb|holiday (let|rental)/i],
    ["budget",     /tight budget|cheap|best price|competitive|shopping around|other quotes/i]
  ];
  var TOPIC_LABEL = {
    price: "Asking a price", when: "When can you come", rebook: "Wants another clean",
    confirm: "Confirming a booking", invoice: "About an invoice", reschedule: "Wants to move it",
    problem: "Not happy", general: "Not sure"
  };
  var SIGNAL_LABEL = {
    urgent: "in a hurry", inspection: "inspection coming", selling: "selling the place",
    moving: "end of lease", renovation: "after a reno", salt: "salt build up",
    mould: "mould", hardwater: "hard water marks", dog: "has a dog", gate: "gate or access",
    notHome: "will not be home", high: "high or two storey", commercial: "business or rental",
    budget: "price sensitive"
  };

  function readMessage(text) {
    var topic = "general", signals = [];
    for (var i = 0; i < TOPIC.length; i++) {
      if (TOPIC[i][1].test(text)) { topic = TOPIC[i][0]; break; }
    }
    SIGNAL.forEach(function (s) { if (s[1].test(text)) signals.push(s[0]); });
    return { topic: topic, signals: signals };
  }

  function buildReply(text, tone) {
    var r = readMessage(text);
    var brief = tone === "brief", warm = tone === "warm";
    var has = function (s) { return r.signals.indexOf(s) !== -1; };
    var L = [];

    L.push(warm ? "Hi, thanks for getting in touch." : brief ? "Hi," : "Hi, thanks for the message.");
    L.push("");

    if (r.topic === "price") {
      L.push("Happy to give you a price. A single storey place done on the outside starts at " +
             money(qset.minSingle) + ", and two storey starts at " + money(qset.minDouble) + ".");
      L.push("The exact number comes down to how many windows there are and whether you want the " +
             "insides done as well, so if you can tell me roughly how many and whether it is single " +
             "or double storey I can give you a firm figure straight back.");
    } else if (r.topic === "when") {
      L.push("I have got room coming up and can most likely sort you out." +
             (has("urgent") ? " I will see what I can do to get to you quickly." : ""));
      L.push("What days generally suit you? I will line up the closest one I have free.");
    } else if (r.topic === "rebook") {
      L.push("Good to hear from you again - happy to get you back in the book.");
      L.push("What week works for you and I will lock it in.");
    } else if (r.topic === "confirm") {
      L.push("Yes, all still on. I will give you a heads up when I am on the way.");
      L.push("Anything you want me to keep an eye on while I am there, just say.");
    } else if (r.topic === "invoice") {
      L.push("No problem. I will send the invoice through with the bank details on it.");
      L.push("Bank transfer is easiest, and there is no rush.");
    } else if (r.topic === "reschedule") {
      L.push("Not a problem at all, things come up.");
      L.push("What day suits you better? I will move it across.");
    } else if (r.topic === "problem") {
      L.push("Sorry to hear that - that is not the standard I work to and I want it sorted.");
      L.push("I will come back and put it right at no charge. What day suits you?");
    } else {
      L.push("Happy to help with that.");
      L.push("Let me know a bit more about what you are after and I will get straight back to you.");
    }

    /* Anything we picked up about the property that is worth mentioning. */
    var notes = [];
    if (has("inspection") || has("selling")) notes.push("I know there is a deadline on it - I will make sure you are done in time.");
    if (has("moving")) notes.push("End of lease work is common for me, so I know what the agents look for.");
    if (has("renovation")) notes.push("Builders dust and render splatter needs a bit of extra work, but it comes off.");
    if (has("salt")) notes.push("Salt build-up near the water is normal up here and it cleans off fine.");
    if (has("mould") || has("hardwater")) notes.push("Those marks usually come off - I will let you know when I see them if any are in the glass for good.");
    if (has("high")) notes.push("Upstairs is no trouble, I am set up for pole work.");
    if (has("commercial")) notes.push("I do a fair bit of commercial and rental work, so I can work around your hours.");
    if (has("gate")) notes.push("Just let me know about the access on the day.");
    if (has("dog")) notes.push("Dogs are fine, I just need to know they are shut away while the gate is open.");
    if (has("notHome")) notes.push("You do not need to be home for the outsides.");
    if (has("budget")) notes.push("I am not the cheapest, but you will not be calling someone back to redo it.");

    if (notes.length && !brief) {
      L.push("");
      L.push(notes.slice(0, 2).join(" "));
    }

    L.push("");
    L.push(warm ? "Cheers," : "Thanks,");
    L.push("Liam");
    L.push("Far North Window Cleaning");
    L.push("0478 521 431");

    return { text: L.join("\n"), read: r };
  }

  /* ----------------------------------------------------------- CAR AND TAX
     Every job already records the round-trip kilometres. Nothing has ever done
     anything with them but estimate fuel, which means a year of travel records
     was being thrown away twelve months at a time. For a sole trader the car
     is usually the second biggest deduction there is.

     This keeps the record. It does not give tax advice, and it deliberately
     does not know the rates - they change every year and anything baked in
     here would be wrong by the time it mattered.
     --------------------------------------------------------------------- */

  function vCar(root) {
    var years = FNWCVehicle.yearsWithTrips(db);
    var fy = state.cfy != null ? state.cfy : years[0];
    var y = FNWCVehicle.year(db, fy);
    var cpk = FNWCVehicle.centsPerKmClaim(db, fy);

    html(root, '<div class="seg" style="margin-bottom:12px">' +
      years.map(function (v) {
        return '<button data-cfy="' + v + '" class="' + (v === fy ? "on" : "") + '">FY ' +
          v + "/" + String(v + 1).slice(2) + "</button>";
      }).join("") + "</div>");

    html(root, '<div class="grid3" style="margin-bottom:12px">' +
      '<div class="stat"><b>' + y.km + "</b><span>business km</span></div>" +
      '<div class="stat"><b>' + y.tripCount + "</b><span>trips</span></div>" +
      '<div class="stat"><b class="money">' +
        (cpk.amount != null ? money(cpk.amount) : "—") + "</b><span>cents/km claim</span></div>" +
      "</div>");

    var CONF = { none: ["nothing logged", "bad"], poor: ["mostly estimated", "bad"],
                 fair: ["some estimated", "warn"], good: ["well recorded", "good"] };
    var c = CONF[y.confidence];
    html(root, '<div class="card" style="padding:10px 12px;margin-bottom:12px">' +
      '<div class="rowx"><span class="tiny">' + y.recordedCount + " of " + y.tripCount +
      ' trips have real kilometres on them</span><span class="tag ' + c[1] +
      '" style="margin-left:auto">' + c[0] + "</span></div>" +
      (y.estimatedCount ? '<div class="tiny" style="margin-top:6px">' + y.estimatedCount +
        " were worked out from the driving time because no km was entered (" + y.estimatedKm +

    if (cpk.needsRate) {
      html(root, '<div class="card" style="border-color:var(--warn)">' +
        "<h3>Put this year's rate in</h3>" +
        '<div class="sub mt">The Tax Office sets a cents-per-kilometre rate each year and I will not ' +
        "guess it — a wrong rate quietly producing a confident number is worse than a blank. " +
        "Look up the current rate and enter it below.</div></div>");
    }

    html(root, '<div class="card"><h3>Cents per kilometre</h3>' +
      '<div class="sub" style="margin-bottom:10px">Simplest method. Capped at ' + cpk.cap +
      " km a year, no logbook needed, but you must be able to show how you got the number — " +
      "which is what the download below is for.</div>" +
      '<div class="grid2">' +
        field("Rate (cents per km)", "car_rate", "number", null,
          db.settings.centsPerKm || "", ' inputmode="decimal" placeholder="e.g. 88"') +
        field("Cap (km per year)", "car_cap", "number", null,
          db.settings.centsPerKmCap == null ? 5000 : db.settings.centsPerKmCap, ' inputmode="numeric"') +
      "</div>" +
      '<button class="btn p full" id="carSaveRate">Save</button>' +
      '<hr class="sep">' +
      '<div class="q-line"><span>Business km this year</span><b>' + y.km + "</b></div>" +
      '<div class="q-line"><span>Claimable</span><b>' + cpk.claimableKm + " km</b></div>" +
      (cpk.overCap ? '<div class="tiny" style="color:var(--warn)">You are ' + cpk.kmOverCap +

      (cpk.amount != null
        ? '<div class="q-total money">' + money(cpk.amount) + "</div>" : "") +
      "</div>");

    /* The logbook method. Twelve straight weeks, and the app can pick the best
       stretch because "representative" is the test, not "lowest". */
    var best = FNWCVehicle.bestPeriod(db, fy);
    html(root, '<div class="card"><h3>Logbook method</h3>' +
      '<div class="sub" style="margin-bottom:10px">Twelve straight weeks gives a business-use ' +
      "percentage that then applies to everything the car costs, and stands for five years. " +
      "More work, usually worth more. It cannot be done after the fact without records.</div>" +
      (best
        ? '<div class="q-line"><span>Best twelve weeks</span><b class="tiny">' +
            esc(plainDate(best.from)) + " to " + esc(plainDate(best.to)) + "</b></div>" +
          '<div class="q-line"><span>Business km in that stretch</span><b>' + best.businessKm + "</b></div>" +
          '<div class="q-line"><span>Days you worked</span><b>' + best.days + "</b></div>" +
          '<div class="mt">' +
            field("Total km the car did in those weeks", "car_total", "number", null,
              db.settings.logbookTotalKm || "", ' inputmode="numeric" placeholder="off the odometer"') +
          "</div>" +
          '<div id="car_pct" class="tiny" style="margin-bottom:10px"></div>' +
          '<div class="grid2">' +
            field("Car costs for the year $", "car_costs", "number", null,
              db.settings.carRunningCosts || "", ' inputmode="decimal" placeholder="fuel, rego, insurance, servicing"') +
            field("Business use %", "car_pctIn", "number", null,
              db.settings.businessUsePct || "", ' inputmode="decimal"') +
          "</div>" +
          '<button class="btn p full" id="carSaveLog">Save</button>'
        : '<div class="tiny">No trips recorded yet, so there is no stretch to suggest.</div>') +
      "</div>");

    var cmp = FNWCVehicle.compare(db, fy, {
      runningCosts: db.settings.carRunningCosts,
      businessUsePct: db.settings.businessUsePct
    });
    if (cmp.better) {
      html(root, '<div class="card" style="border-color:var(--good)">' +
        "<h3>The " + (cmp.better === "logbook" ? "logbook" : "cents per km") + " method looks better</h3>" +
        '<div class="q-line"><span>Cents per km</span><b class="money">' + money(cmp.centsPerKm.amount) + "</b></div>" +
        '<div class="q-line"><span>Logbook</span><b class="money">' + money(cmp.logbook.amount) + "</b></div>" +
        '<div class="sub mt">A difference of <b>' + money(cmp.difference) + "</b>. Worth showing your " +
        "accountant both numbers rather than taking mine for it.</div></div>");
    }

    html(root, '<div class="card"><h3>For the accountant</h3>' +
      '<div class="sub" style="margin-bottom:10px">Every trip, with the date, where it was and how far. ' +
      "It says which figures were recorded and which were worked out, because they should not be " +
      "treated the same.</div>" +
      '<button class="btn full" id="carCsv">Download the logbook</button></div>');

    html(root, '<div class="tiny" style="text-align:center;padding:8px 0 20px">' +
      "Record keeping, not tax advice. What is actually claimable is between you and your " +
      "accountant.</div>");

    on("[data-cfy]", function (e) { state.cfy = parseInt(e.dataset.cfy, 10); render(); }, root);

    document.getElementById("carSaveRate").onclick = function () {
      if (commit(function (f) {
        f.settings = f.settings || {};
        f.settings.centsPerKm = num("car_rate");
        f.settings.centsPerKmCap = int("car_cap") || 5000;
      })) { toast("Saved"); render(); }
    };

    var totalIn = document.getElementById("car_total");
    if (totalIn && best) {
      var paint = function () {
        var u = FNWCVehicle.businessUse(best, totalIn.value);
        var note = document.getElementById("car_pct");
        note.textContent = u
          ? "That is " + u.pct + "% business (" + u.businessKm + " of " + u.totalKm + " km, " +
            u.privateKm + " private)."
          : "Enter what the odometer says the car did over those weeks and it works out the percentage.";
        note.style.color = u ? "var(--good)" : "var(--dim)";
      };
      totalIn.addEventListener("input", paint);
      paint();

      document.getElementById("carSaveLog").onclick = function () {
        var u = FNWCVehicle.businessUse(best, val("car_total"));
        if (commit(function (f) {
          f.settings = f.settings || {};
          f.settings.logbookTotalKm = num("car_total");
          f.settings.carRunningCosts = num("car_costs");
          f.settings.businessUsePct = num("car_pctIn") || (u ? u.pct : 0);
        })) { toast("Saved"); render(); }
      };
    }

    document.getElementById("carCsv").onclick = function () {
      var text = FNWCVehicle.csv(y.trips);
      var blob = new Blob([text], { type: "text/csv" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "fnwc-logbook-" + y.label.replace("/", "-") + ".csv";
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("Downloaded");
    };
  }

  function vSpending(root) {
    var fy = state.fy != null ? state.fy : fyOf(todayISO());
    var years = {};
    db.expenses.forEach(function (e) { var y = fyOf(e.date); if (y != null) years[y] = 1; });
    db.jobs.forEach(function (j) { var y = fyOf(j.date); if (y != null) years[y] = 1; });
    years[fyOf(todayISO())] = 1;
    var yearList = Object.keys(years).map(Number).sort(function (a, b) { return b - a; });

    var exps = db.expenses.filter(function (e) { return fyOf(e.date) === fy; });
    var spent = exps.reduce(function (s, e) {
      var use = e.use == null ? 100 : e.use;
      return s + (+e.amount || 0) * (use / 100);
    }, 0);
    var earned = db.jobs.filter(function (j) {
      return fyOf(j.date) === fy && (j.status === "paid" || j.status === "invoiced" || j.status === "done");
    }).reduce(function (s, j) { return s + (+j.price || 0); }, 0);

    html(root, '<div class="seg" style="margin-bottom:12px">' +
      yearList.map(function (y) {
        return '<button data-fy="' + y + '" class="' + (y === fy ? "on" : "") + '">FY ' + y + "/" + String(y + 1).slice(2) + "</button>";
      }).join("") + "</div>");

    html(root, '<div class="grid3" style="margin-bottom:12px">' +
      '<div class="stat"><b class="money">' + money(earned) + "</b><span>came in</span></div>" +
      '<div class="stat"><b class="money">' + money(spent) + "</b><span>claimable</span></div>" +
      '<div class="stat"><b class="money">' + money(earned - spent) + "</b><span>profit</span></div>" +
      "</div>");

    html(root, '<button class="btn p full" data-a="exp" style="margin-bottom:14px">+ Log an expense</button>');

    /* Where the money went, biggest first - the view that actually changes
       what you buy next month. */
    var byCat = {};
    exps.forEach(function (e) {
      var use = e.use == null ? 100 : e.use;
      var c = e.category || "Other";
      byCat[c] = (byCat[c] || 0) + (+e.amount || 0) * (use / 100);
    });
    var cats = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });
    if (cats.length) {
      html(root, '<div class="card"><h3 style="margin-bottom:10px">Where it went</h3>' +
        cats.map(function (c) {
          var pct = spent > 0 ? Math.round(byCat[c] / spent * 100) : 0;
          return '<div class="q-line"><span>' + esc(c) + ' <span class="tiny">' + pct + '%</span></span>' +
                 '<b class="money">' + money2(byCat[c]) + "</b></div>";
        }).join("") + "</div>");
    }

    html(root, '<h3 style="margin:16px 0 8px">Receipts</h3>');
    var list = exps.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    if (!list.length) {
      html(root, '<div class="card">' + empty("\u{1F4D2}", "Nothing logged this year",
        "Snap it the moment you pay for it - that is the whole trick.") + "</div>");
    } else {
      list.slice(0, 150).forEach(function (e) {
        html(root, '<div class="item" data-exp="' + esc(e.id) + '"><div class="rowx"><div style="min-width:0">' +
          '<div class="t">' + esc(e.desc) + "</div>" +
          '<div class="m">' + esc(niceDate(e.date)) + " &middot; " + esc(e.category || "Other") +
            (e.use != null && e.use < 100 ? " &middot; " + e.use + "% business" : "") +
            (e.photo ? " &middot; \u{1F4F7}" : "") + "</div>" +
          '</div><div class="r"><b class="money">' + money2(e.amount) + "</b></div></div></div>");
      });
    }

    on("[data-fy]", function (e) { state.fy = parseInt(e.dataset.fy, 10); render(); }, root);
    on("[data-a]", function () { editExpense(); }, root);
    on("[data-exp]", function (e) { expSheet(e.dataset.exp); }, root);
  }

  function expSheet(id) {
    var e = db.expenses.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    var use = e.use == null ? 100 : e.use;
    var h = "<h3>" + esc(e.desc) + "</h3>" +
      '<div class="sub">' + esc(niceDate(e.date)) + " &middot; " + esc(e.category || "Other") + "</div>" +
      '<hr class="sep">' +
      '<div class="q-line"><span>Paid</span><b class="money">' + money2(e.amount) + "</b></div>" +
      '<div class="q-line"><span>Business use</span><b>' + use + "%</b></div>" +
      '<div class="q-line"><span>Claimable</span><b class="money">' + money2((+e.amount || 0) * use / 100) + "</b></div>" +
      (e.supplier ? '<div class="q-line"><span>From</span><b>' + esc(e.supplier) + "</b></div>" : "") +
      (e.note ? '<div class="sub mt">' + esc(e.note) + "</div>" : "") +
      (e.photo ? '<img src="' + esc(e.photo) + '" alt="Receipt" style="width:100%;border-radius:11px;margin-top:12px">' : "");

    openSheet("Expense", h, [
      { label: "Edit", on: function () { closeSheet(); editExpense(e); } },
      { label: "Delete", cls: "d", on: function () {
          closeSheet();
          doWithUndo("Expense deleted", function (f) {
