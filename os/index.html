  function editExpense(e) {
    var isNew = !e;
    e = e || { date: todayISO(), desc: "", category: "Fuel", amount: "", use: 100,
               note: "", supplier: "", photo: null };
    var pendingPhoto = e.photo || null;

    var h = field("What was it", "ef_desc", "text", null, e.desc, ' placeholder="Fuel, squeegee rubber, insurance..."') +
      '<div class="grid2">' +
        field("Amount $", "ef_amt", "number", null, e.amount, ' inputmode="decimal" step="0.01"') +
        field("Date", "ef_date", "date", null, e.date) +
      "</div>" +
      field("Category", "ef_cat", "select", CATS.map(function (c) { return [c, c]; }), e.category) +
      '<div class="grid2">' +
        field("Business use %", "ef_use", "number", null, e.use == null ? 100 : e.use, ' inputmode="numeric"') +
        field("Bought from", "ef_sup", "text", null, e.supplier) +
      "</div>" +
      field("Note", "ef_note", "text", null, e.note) +
      '<label class="f"><span>Receipt photo</span>' +
      '<input class="in" id="ef_photo" type="file" accept="image/*" capture="environment"></label>' +
      '<div class="tiny" id="ef_pnote">' +
        (pendingPhoto ? "A photo is attached. Pick another to replace it." :
         "Snap the receipt now - the ATO wants it and paper fades in the ute.") + "</div>" +
      (pendingPhoto ? '<img id="ef_prev" src="' + esc(pendingPhoto) + '" style="width:100%;border-radius:11px;margin-top:10px">' : "");

    openSheet(isNew ? "New expense" : "Edit expense", h, [
      { label: "Cancel", on: closeSheet },
      { label: "Save", cls: "p", on: function () {
          var desc = val("ef_desc"), amt = num("ef_amt");
          if (!desc) { toast("What was it for?"); document.getElementById("ef_desc").focus(); return; }
          if (!(amt > 0)) { toast("How much was it?"); document.getElementById("ef_amt").focus(); return; }
          var use = int("ef_use");
          if (!isFinite(use) || use < 0 || use > 100) use = 100;

          var ok = commit(function (f) {
            var rec = {
              date: val("ef_date") || todayISO(),
              desc: desc,
              category: val("ef_cat") || "Other",
              amount: Math.round(amt * 100) / 100,
              use: use,
              note: val("ef_note"),
              supplier: val("ef_sup"),
              photo: pendingPhoto || null
            };
            f.expenses = f.expenses || [];
            if (isNew) {
              rec.id = uid();
              rec.added = new Date().toISOString();
              f.expenses.push(rec);
            } else {
              f.expenses.forEach(function (x) { if (x.id === e.id) Object.assign(x, rec); });
            }
          });
          if (ok) { closeSheet(); toast("Logged"); render(); }
        } }
    ]);

    /* Receipts get squeezed down hard before they are stored. A raw phone
       photo is three or four megabytes; localStorage gives you about five in
       total, and every one of those bytes also has to go up to Firestore. */
    document.getElementById("ef_photo").onchange = function (ev) {
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var note = document.getElementById("ef_pnote");
      note.textContent = "Shrinking the photo...";
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 1000;
          var w = img.width, h2 = img.height;
          if (w > max || h2 > max) {
            var s = Math.min(max / w, max / h2);
            w = Math.round(w * s); h2 = Math.round(h2 * s);
          }
          var cv = document.createElement("canvas");
          cv.width = w; cv.height = h2;
          cv.getContext("2d").drawImage(img, 0, 0, w, h2);
          pendingPhoto = cv.toDataURL("image/jpeg", 0.62);
          note.textContent = "Photo attached (" + Math.round(pendingPhoto.length / 1024) + " KB).";
          var prev = document.getElementById("ef_prev");
          if (!prev) {
            prev = document.createElement("img");
            prev.id = "ef_prev";
            prev.setAttribute("style", "width:100%;border-radius:11px;margin-top:10px");
            note.parentNode.appendChild(prev);
          }
          prev.src = pendingPhoto;
        };
        img.onerror = function () { note.textContent = "That image could not be read."; };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    };
  }

  /* ---------- bringing a customer list in --------------------------------
     Two steps on purpose. Paste, see exactly what it is going to do, then
     apply. Import is the one thing in here that can quietly wreck the data -
     duplicate everyone, or blank details that were already right - so it never
     happens on one tap.
     --------------------------------------------------------------------- */

  function importSheet() {
    var h = '<div class="sub">Paste from a spreadsheet, a CSV, or just type one per line. ' +
      "Headings help but are not needed — it can work most of it out from the data.</div>" +
      '<label class="f" style="margin-top:10px"><span>Your list</span>' +
      '<textarea class="in" id="im_text" style="min-height:150px" placeholder="Sarah Wilkins, 0412 345 678, Trinity Beach, 3&#10;Dave Toomey, 0400 111 222, Redlynch, 6"></textarea></label>' +
      '<div class="tiny">Name, phone, suburb, how often in months, notes — in any order.</div>';

    openSheet("Bring customers in", h, [
      { label: "Cancel", on: closeSheet },
      { label: "Have a look", cls: "p", on: function () {
          var text = val("im_text");
          if (!text) { toast("Paste the list in first"); return; }
          var parsed = FNWCImport.parse(text);
          if (!parsed.rows.length) { toast("Could not find anybody in that"); return; }
          importPlanSheet(parsed);
        } }
    ]);
    setTimeout(function () { document.getElementById("im_text").focus(); }, 60);
  }

  function importPlanSheet(parsed) {
    load();
    var plan = FNWCImport.plan(db, parsed.rows);
    var skipped = {};
    var FIELD_LABEL = { name: "Name", phone: "Phone", email: "Email",
                        suburb: "Suburb", freqMonths: "Every (months)", notes: "Notes" };

    var cols = Object.keys(parsed.map).map(function (i) { return FIELD_LABEL[parsed.map[i]]; });

    var h = '<div class="wrap" style="margin-bottom:10px">' +
      '<span class="tag good">' + plan.add.length + " new</span>" +
      '<span class="tag info">' + plan.update.length + " to update</span>" +
      '<span class="tag">' + plan.skip.length + " skipped</span>" + "</div>" +
      '<div class="tiny" style="margin-bottom:12px">Read as: ' + esc(cols.join(", ")) +
      (parsed.hadHeader ? " (from your headings)." : " (worked out from the data).") +
      " Tap anyone you do not want.</div>";

    if (plan.add.length) {
      h += "<h4 style=\"margin:10px 0 6px\">New</h4>" +
        plan.add.map(function (a, i) {
          var c = a.customer;
          return '<div class="q-line" data-pick="add:' + i + '"><span>' + esc(c.name) +
            '<br><span class="tiny">' + esc([c.phone, c.suburb, c.freqMonths ? "every " + c.freqMonths + "m" : ""]
              .filter(Boolean).join(" · ")) + "</span></span>" +
            '<b class="tag good" data-tick>add</b></div>';
        }).join("");
    }

    if (plan.update.length) {
      h += "<h4 style=\"margin:14px 0 6px\">Already on file</h4>" +
        plan.update.map(function (u, i) {
          var fields = Object.keys(u.changes).map(function (k) { return FIELD_LABEL[k]; }).join(", ");
          return '<div class="q-line" data-pick="update:' + i + '"><span>' + esc(u.existing.name) +
            '<br><span class="tiny">adds ' + esc(fields.toLowerCase()) +
            (u.unsure ? " · matched on name and suburb only" : " · matched on " + esc(u.matchedOn)) +
            "</span></span>" +
            '<b class="tag ' + (u.unsure ? "warn" : "info") + '" data-tick>update</b></div>';
        }).join("");
    }

    if (plan.skip.length) {
      h += "<h4 style=\"margin:14px 0 6px\">Skipped</h4>" +
        plan.skip.map(function (s) {
          return '<div class="q-line"><span>' + esc(s.customer.name || s.customer.phone || "(blank)") +
            "</span><b class=\"tiny\">" + esc(s.why) + "</b></div>";
        }).join("");
    }

    openSheet("What this will do", h, [
      { label: "Back", on: function () { closeSheet(); importSheet(); } },
      { label: "Import", cls: "p", on: function () {
          var adds = plan.add.filter(function (a, i) { return !skipped["add:" + i]; });
          var ups = plan.update.filter(function (u, i) { return !skipped["update:" + i]; });
          if (!adds.length && !ups.length) { toast("Nothing left to import"); return; }

          /* Applied once, inside commit, so it lands on a freshly read store
             and a sync arriving mid-import is not trampled. */
          var res = null;
          if (!commit(function (f) {
            res = FNWCImport.apply(f, { add: adds, update: ups }, uid);
          })) return;

          closeSheet();
          toast(res.added + " added, " + res.updated + " updated");
          go("customers");
        } }
    ]);

    /* Tapping a row drops it from the import. */
    on("[data-pick]", function (row) {
      var key = row.dataset.pick;
      skipped[key] = !skipped[key];
      row.style.opacity = skipped[key] ? ".4" : "1";
      var tick = row.querySelector("[data-tick]");
      if (tick) tick.textContent = skipped[key] ? "no" : (key.indexOf("add") === 0 ? "add" : "update");
    }, $("#sheetBody"));
  }

      '<div class="q-line"><span>Customers</span><b>' + db.customers.length + "</b></div>" +
      '<div class="q-line"><span>Jobs</span><b>' + db.jobs.length + "</b></div>" +
      '<div class="q-line"><span>Leads</span><b>' + db.leads.length + "</b></div>" +
      '<div class="q-line"><span>Expenses</span><b>' + db.expenses.length + "</b></div>" +
      '<div class="q-line"><span>Storage used</span><b>' +
        Math.round((localStorage.getItem(KEY) || "").length / 1024) + " KB</b></div>" +
    "</div>");

    html(root, '<div class="card"><h3>Rate card</h3>' +
      '<div class="sub" style="margin-bottom:10px">These come from the quote calculator and sync with it.</div>' +
      '<div class="grid2">' +
        field("Single storey min $", "st_minS", "number", null, qset.minSingle, ' inputmode="decimal"') +
        field("Two storey min $", "st_minD", "number", null, qset.minDouble, ' inputmode="decimal"') +
      "</div>" +
      '<div class="grid2">' +
        field("Standard, outside $", "st_stdO", "number", null, qset.stdOut, ' inputmode="decimal"') +
        field("Standard, in + out $", "st_stdB", "number", null, qset.stdBoth, ' inputmode="decimal"') +
      "</div>" +
      '<div class="grid2">' +
        field("Target $/hour", "st_rate", "number", null, qset.targetRate, ' inputmode="decimal"') +
        field("Travel fee $", "st_trav", "number", null, qset.travelFee, ' inputmode="decimal"') +
      "</div>" +
      '<button class="btn p full" id="sSaveRates">Save the rate card</button>' +
    "</div>");

    html(root, '<div class="card"><h3>Follow ups</h3>' +
      '<div class="sub" style="margin-bottom:10px">The review link goes into every review message. ' +
      "Without it people have to go and find you, and they will not.</div>" +
      field("Google review link", "st_rurl", "url", null, (db.settings || {}).reviewUrl || "",
        ' placeholder="https://g.page/r/..."') +
      '<div class="grid2">' +
        field("Ask for a review after (days)", "st_rafter", "number", null,
          db.settings.reviewAfter == null ? 2 : db.settings.reviewAfter, ' inputmode="numeric"') +
        field("Stay quiet after asking (days)", "st_rquiet", "number", null,
          db.settings.rebookQuiet == null ? 14 : db.settings.rebookQuiet, ' inputmode="numeric"') +
      "</div>" +
      '<button class="btn p full" id="sSaveFu">Save</button></div>');

    /* Where the day starts and ends. Every route is measured from here, so a
       wrong base makes every number on the diary wrong with it. */
    var unplaced = FNWCGeo.unplacedSuburbs(db);
    html(root, '<div class="card"><h3>Where you start from</h3>' +
      '<div class="sub" style="margin-bottom:10px">Driving times and the running order are worked ' +
      "out from here, so it is worth getting right.</div>" +
      field("Base suburb", "st_base", "text", null,
        db.settings.baseSuburb || FNWCGeo.DEFAULTS.baseSuburb, ' list="subList" placeholder="Cairns City"') +
      '<datalist id="subList">' + FNWCGeo.suburbNames().map(function (s) {
        return '<option value="' + esc(titleCase(s)) + '">';
      }).join("") + "</datalist>" +
      '<div class="tiny" id="st_baseNote"></div>' +
      '<button class="btn p full mt" id="sSaveBase">Save</button>' +
      (unplaced.length
        ? '<hr class="sep"><div class="tiny" style="margin-bottom:8px">The map has not heard of ' +
          unplaced.length + " suburb" + (unplaced.length === 1 ? "" : "s") +
          " you have used. Jobs there are left out of the route working.</div>" +
          unplaced.map(function (u) {
            return '<div class="q-line"><span>' + esc(titleCase(u.suburb)) +
              ' <span class="tiny">' + u.count + " job" + (u.count === 1 ? "" : "s") + "</span></span>" +
              '<button class="btn sm" data-place="' + esc(u.suburb) + '">Place it</button></div>';
          }).join("")
        : "") +
    "</div>");

    html(root, '<div class="card"><h3>Getting paid</h3>' +
      '<div class="sub" style="margin-bottom:10px">Bank details go on the bottom of every payment ' +
      "reminder, so people do not have to go looking for them.</div>" +
      field("Days to pay", "st_terms", "number", null,
        db.settings.invoiceTerms == null ? 7 : db.settings.invoiceTerms, ' inputmode="numeric"') +
      field("Account name", "st_accName", "text", null, db.settings.accName || "") +
      '<div class="grid2">' +
        field("BSB", "st_bsb", "text", null, db.settings.bsb || "", ' inputmode="numeric"') +
        field("Account number", "st_acc", "text", null, db.settings.acc || "", ' inputmode="numeric"') +
      "</div>" +
      '<button class="btn p full" id="sSavePay">Save</button></div>');

    html(root, '<div class="card"><h3>Bring your customers in</h3>' +
      '<div class="sub" style="margin-bottom:10px">Paste a list and it works out which column is ' +
      "which. Anyone already on file is updated rather than added twice, and nothing is written " +
      "until you have seen what it plans to do.</div>" +
      '<button class="btn p full" id="sImport">Paste a customer list</button></div>');

    html(root, '<div class="card"><h3>Backup</h3>' +
      '<div class="sub" style="margin-bottom:10px">A copy of everything, as a file. Worth doing before a big change even with sync on.</div>' +
      '<button class="btn full" id="sExport">Download a backup</button></div>');

    html(root, '<div class="card"><h3>On the PC</h3>' +
      '<div class="sub">Window OS, the Diary, the Job Assistant, the Reply Desk, the quote calculator, ' +
      'the invoice maker and the Books are all still there and all still work. This app is the same ' +
      'data, cut down to what is worth doing one-handed.</div></div>');

    document.getElementById("sSync").onclick = function () {
      if (on1) { FNWCSync.syncNow().then(function () { toast("Synced"); render(); }); }
      else FNWCSync.openPanel();
    };
    if (document.getElementById("sPanel")) {
      document.getElementById("sPanel").onclick = function () { FNWCSync.openPanel(); };
    }

    /* The escape hatch for when a phone is still holding an old copy. It
       clears the worker's cache and unregisters it, so the next load comes
       straight off the network. Touches nothing in localStorage - your jobs
       and receipts are not in there. */
    document.getElementById("sForce").onclick = function () {
      toast("Fetching the latest...");
      var jobs = [];
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches["delete"](k); }));
        }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      Promise.all(jobs)["catch"](function () {})
        .then(function () { location.replace(location.pathname + "?u=" + Date.now()); });
    };

    (function () {
      var input = document.getElementById("st_base");
      var note = document.getElementById("st_baseNote");
      var check = function () {
        var p = FNWCGeo.lookup(input.value, db);
        note.textContent = p ? "Found: " + titleCase(p.name) + " (" + p.zone + ")"
                             : "Not a suburb the map knows. Routes will fall back to Cairns City.";
        note.style.color = p ? "var(--good)" : "var(--warn)";
      };
      input.addEventListener("input", check);
      check();
    })();

    document.getElementById("sSaveBase").onclick = function () {
      if (commit(function (f) {
        f.settings = f.settings || {};
        f.settings.baseSuburb = val("st_base") || FNWCGeo.DEFAULTS.baseSuburb;
      })) { toast("Base saved"); render(); }
    };

    on("[data-place]", function (e) { placeSheet(e.dataset.place); }, root);

    document.getElementById("sImport").onclick = function () { importSheet(); };

    document.getElementById("sSavePay").onclick = function () {
      if (commit(function (f) {
        f.settings = f.settings || {};
        var t = int("st_terms");
        f.settings.invoiceTerms = t >= 0 ? t : 7;
        f.settings.accName = val("st_accName");
        f.settings.bsb = val("st_bsb");
        f.settings.acc = val("st_acc");
      })) { toast("Saved"); render(); }
    };

    document.getElementById("sSaveFu").onclick = function () {
      var u = val("st_rurl");
      if (u && !/^https?:\/\//i.test(u)) { toast("The link needs to start with https://"); return; }
      if (commit(function (f) {
        f.settings = f.settings || {};
        f.settings.reviewUrl = u;
        f.settings.reviewAfter = int("st_rafter");
        f.settings.rebookQuiet = int("st_rquiet");
      })) { toast("Saved"); render(); }
    };

    document.getElementById("sSaveRates").onclick = function () {
      qset.minSingle = num("st_minS"); qset.minDouble = num("st_minD");
      qset.stdOut = num("st_stdO"); qset.stdBoth = num("st_stdB");
      qset.targetRate = num("st_rate"); qset.travelFee = num("st_trav");
      saveQ(); toast("Rate card saved");
    };

    document.getElementById("sExport").onclick = function () {
      var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "fnwc-backup-" + todayISO() + ".json";
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("Backup downloaded");
    };
  }

  /* =========================================================================
     BOOT
     ====================================================================== */

  /* ---------- search -----------------------------------------------------
     One box across the lot. Customers had their own search and nothing else
     did, so finding a job by the customer's name meant knowing which screen to
     be on first - which is exactly the thing you have forgotten when you are
     standing on someone's doorstep.
     --------------------------------------------------------------------- */

  function searchAll(q) {
    q = String(q || "").toLowerCase().trim();
    if (q.length < 2) return [];
    var hits = [];
    var has = function (s) { return String(s == null ? "" : s).toLowerCase().indexOf(q) !== -1; };

    db.customers.forEach(function (c) {
      if (has(c.name) || has(c.suburb) || has(c.phone) || has(c.email) || has(c.notes)) {
        hits.push({ kind: "Customer", title: c.name,
                    sub: [c.suburb, c.phone].filter(Boolean).join(" · "),
                    go: function () { closeSearch(); go("customers"); custSheet(c.id); } });
      }
    });

    db.jobs.forEach(function (j) {
      var c = custOf(j.customerId);
      if (has(c ? c.name : "") || has(j.suburb) || has(j.services) || has(j.invoiceNo)) {
        hits.push({ kind: "Job", title: (c ? c.name : "(unknown)") + " · " + money(j.price),
                    sub: [niceDate(j.date), j.suburb, j.invoiceNo].filter(Boolean).join(" · "),
                    go: function () { closeSearch(); go("jobs"); jobSheet(j.id); } });
      }
    });

    db.leads.forEach(function (l) {
      if (has(l.name) || has(l.suburb) || has(l.phone) || has(l.notes)) {
        hits.push({ kind: "Lead", title: l.name,
                    sub: [l.suburb, STAGE_LABEL[l.stage]].filter(Boolean).join(" · "),
                    go: function () { closeSearch(); go("leads"); leadSheet(l.id); } });
      }
    });

    (db.expenses || []).forEach(function (e) {
      if (has(e.desc) || has(e.supplier) || has(e.category) || has(e.note)) {
        hits.push({ kind: "Expense", title: e.desc + " · " + money2(e.amount),
                    sub: [niceDate(e.date), e.category].filter(Boolean).join(" · "),
                    go: function () { closeSearch(); go("books"); expSheet(e.id); } });
      }
    });

    return hits.slice(0, 40);
  }

  function drawSearch() {
    var q = document.getElementById("searchIn").value;
    var box = document.getElementById("searchRes");
    var hits = searchAll(q);

    if (q.trim().length < 2) { box.innerHTML = ""; return; }
    if (!hits.length) {
      box.innerHTML = '<div class="tiny" style="padding:10px 2px">Nothing matches that.</div>';
      return;
    }

    var last = "";
    box.innerHTML = hits.map(function (h, i) {
      var head = h.kind !== last ? '<div class="kind">' + h.kind + "</div>" : "";
      last = h.kind;
      return head + '<div class="item" data-hit="' + i + '"><div class="t">' + esc(h.title) + "</div>" +
        (h.sub ? '<div class="m">' + esc(h.sub) + "</div>" : "") + "</div>";
    }).join("");

    on("[data-hit]", function (e) { hits[parseInt(e.dataset.hit, 10)].go(); }, box);
  }

  function openSearch() {
    document.body.classList.add("searching");
    var i = document.getElementById("searchIn");
    i.value = ""; document.getElementById("searchRes").innerHTML = "";
    setTimeout(function () { i.focus(); }, 40);
  }
  function closeSearch() { document.body.classList.remove("searching"); }

  $("#searchBtn").onclick = function () {
    if (document.body.classList.contains("searching")) closeSearch();
    else openSearch();
  };
  $("#searchIn").addEventListener("input", drawSearch);
  $("#searchIn").addEventListener("keydown", function (e) { if (e.key === "Escape") closeSearch(); });

  $("#burger").onclick = function () { document.body.classList.toggle("nav"); };
  $("#scrim").onclick = function () { document.body.classList.remove("nav"); };
  $("#syncBtn").onclick = function () { FNWCSync.openPanel(); };

  window.addEventListener("hashchange", function () { go(location.hash.slice(1)); });

  FNWCSync.onStatus(function (state2, text) {
    var b = $("#syncBtn");
    b.className = state2 === "ok" ? "ok" : state2 === "busy" ? "busy" : state2 === "err" ? "err" : "";
    b.querySelector(".lbl").textContent =
      state2 === "ok" ? text.replace("Synced ", "") : state2 === "busy" ? "..." :
      state2 === "err" ? "!" : "Sync";
  });

  /* When the PC changes something, redraw - but never on top of a form the
     user is halfway through filling in. */
  FNWCSync.onRemoteChange(function () {
    if (sheet.classList.contains("open")) { toast("New data from the PC"); return; }
    render();
    toast("Updated from the PC");
  });

  /* Another tab on this same phone, e.g. the desktop tools opened side by
     side on a laptop. */
  window.addEventListener("storage", function (e) {
    if (e.key === KEY && !sheet.classList.contains("open")) render();
  });

  /* Check for website enquiries in the background, so the count in the menu is
     right without having to open the inbox to find out. */
  if (FNWCSync.isOn()) setTimeout(function () { loadInbox(); }, 1500);
  setInterval(function () { if (!document.hidden && FNWCSync.isOn()) loadInbox(true); }, 180000);

  go(location.hash.slice(1) || "today");
})();
</script>
</body>
</html>
